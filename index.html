<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신신사 일일 경영 브리핑</title>
<link rel="stylesheet" href="briefing/tokens.css">
<script>
/* §4-5 다크 토글 IIFE — DOM 렌더 전 적용 */
(function(){
  var saved = localStorage.getItem('theme');
  if(saved){ document.documentElement.dataset.theme = saved; }
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches){
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="briefing/render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="scorecard/render.js"></script>
<style>
/* ── 워룸 전체화면 대시보드 전용 레이아웃·컴포넌트 (briefing/tokens.css 변수 사용) ── */
*{margin:0;padding:0;}
html,body{height:100%;margin:0;overflow:hidden;}
html{font-size:16px;}
body{line-height:1.5;display:flex;flex-direction:column;}

/* Top bar */
.top-bar{background:var(--card);border-bottom:1px solid var(--bdr);
  padding:8px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.bar-left{display:flex;align-items:center;gap:14px;}
.bar-title{font-size:19px;font-weight:800;color:var(--txt);letter-spacing:-.3px;}
.bar-date{font-size:13px;color:var(--txt-sub);padding-left:12px;border-left:1px solid var(--bdr);}
.conf{font-size:10px;font-weight:700;padding:2px 9px;border-radius:3px;letter-spacing:.6px;
  background:rgba(220,38,38,.1);color:var(--neg);border:1px solid rgba(220,38,38,.25);}
.exec-hero-inline{font-size:13px;color:var(--txt-sub);padding-left:12px;border-left:1px solid var(--bdr);
  max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exec-hero-inline b{color:var(--txt);font-weight:700;}
.hero-oneline{flex-shrink:0;background:linear-gradient(90deg,rgba(255,56,92,.09),rgba(255,56,92,.02));
  border-bottom:1px solid var(--bdr);padding:12px 22px;font-size:15px;font-weight:600;color:var(--txt-body);line-height:1.5;letter-spacing:-.1px;}
.hero-oneline b{color:var(--accent);font-weight:800;margin-right:6px;font-size:15.5px;}
.oneline-box{background:linear-gradient(135deg,rgba(255,56,92,.10),rgba(255,56,92,.02));border:1px solid rgba(255,56,92,.25);}
.oneline-label{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:5px;letter-spacing:-.2px;}
.oneline-text{font-size:13px;font-weight:600;color:var(--txt);line-height:1.5;letter-spacing:-.1px;}
.bar-right{display:flex;align-items:center;gap:8px;}
.nav-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;
  font-size:11px;font-weight:600;background:var(--bg);color:var(--txt-body);text-decoration:none;
  border:1px solid var(--bdr);white-space:nowrap;}
.nav-btn:hover{border-color:var(--info);color:var(--info);}
.nav-btn.score{background:rgba(37,99,235,.1);color:var(--info);border-color:rgba(37,99,235,.25);}

/* 전체화면 메인 그리드: 헤더(auto) + 메인(1fr) */
.app-grid{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0;flex:1;overflow:hidden;}
.main-row{display:grid;grid-template-columns:1fr 1.1fr 1.3fr;gap:10px;height:100%;min-height:0;
  padding:10px;overflow:hidden;}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;}
.col-scroll{overflow-y:auto;min-height:0;}

.sec-label{font-size:10px;font-weight:700;color:var(--txt-lbl);text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.card{margin-bottom:0;padding:12px 14px;display:flex;flex-direction:column;min-height:0;}
.card-fixed{flex-shrink:0;}
.card-grow{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}

/* ★ Executive TOP3 card */
.top3-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;}
.top3-item{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;
  background:var(--bg);border-radius:9px;border:1px solid var(--bdr);flex-shrink:0;}
.rank-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.r1{background:rgba(220,38,38,.12);color:var(--neg);}
.r2{background:rgba(245,158,11,.15);color:var(--accent);}
.r3{background:rgba(37,99,235,.1);color:var(--info);}
.top3-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px;line-height:1.3;}
.top3-reason{font-size:11.5px;color:var(--txt-sub);line-height:1.5;}

/* KPI cells */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;flex-shrink:0;}
.kpi-cell{background:var(--bg);border-radius:9px;padding:9px 11px;border-left:3px solid var(--txt-lbl);}
.kpi-cell.pos{border-left-color:var(--pos);}
.kpi-cell.neg{border-left-color:var(--neg);}
.kpi-cell.gld,.kpi-cell.neu{border-left-color:var(--accent);}
.kl{font-size:10px;color:var(--txt-lbl);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.kv{font-size:20px;font-weight:800;color:var(--txt);line-height:1.1;}
.kv sup{font-size:11px;font-weight:400;color:var(--txt-sub);}
.kc{font-size:11px;margin-top:2px;font-weight:600;}
.kc.pos{color:var(--pos);} .kc.neg{color:var(--neg);} .kc.neu,.kc.gld{color:var(--accent);}

/* Markets (글로벌 시장 지표 — 컴팩트) */
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;}
.mkt-cell{background:var(--bg);border-radius:8px;padding:7px 9px;}
.mkt-lbl{font-size:10px;color:var(--txt-lbl);margin-bottom:2px;}
.mkt-val{font-size:13.5px;font-weight:700;}
.mkt-val.pos{color:var(--pos);} .mkt-val.neg{color:var(--neg);} .mkt-val.gld{color:var(--accent);}

/* CEO schedule */
.sched-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--divider);}
.sched-row:last-child{border-bottom:none;padding-bottom:0;}
.sched-time{font-size:11px;font-weight:700;color:var(--neg);min-width:82px;flex-shrink:0;}
.sched-title{font-size:13px;color:var(--txt);}
.sched-loc{font-size:10px;color:var(--txt-lbl);margin-top:1px;}

/* News filter chips */
.news-hdr-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;flex-shrink:0;}
.lg-links{display:none;align-items:center;gap:6px;}
.lg-active .lg-links{display:flex;}
.lg-lnk{font-size:11px;font-weight:600;color:var(--info);padding:2px 8px;border-radius:4px;
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);text-decoration:none;}
.fbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0;}
.fb{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--bdr);background:var(--card);color:var(--txt-sub);cursor:pointer;white-space:nowrap;}
.fb.active{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.fb[data-f="lg"].active{background:var(--info);border-color:var(--info);color:#fff;}
.fb.empty{opacity:.35;pointer-events:none;}
.fbdg{font-size:10px;padding:0 5px;border-radius:8px;background:rgba(128,128,128,.18);}
.fb.active .fbdg{background:rgba(255,255,255,.3);}

/* News cards — 기사 열 (내부 스크롤만 발생) */
.news-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1;}
.nc{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 13px;
  border-left:3px solid var(--txt-lbl);display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.nc.s3{border-left-color:var(--neg);}
.nc.s2{border-left-color:var(--accent);}
.nc-hd{display:flex;gap:8px;align-items:flex-start;}
.star{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;flex-shrink:0;margin-top:2px;}
.star.s3{background:rgba(220,38,38,.1);color:var(--neg);}
.star.s2{background:rgba(245,158,11,.12);color:var(--accent);}
.star.s1{background:var(--divider);color:var(--txt-lbl);}
.nc-title{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.35;}
.nc-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nc-src{font-size:10.5px;color:var(--txt-lbl);}
.nc-link{font-size:10.5px;color:var(--info);text-decoration:none;padding:1px 8px;border-radius:3px;
  border:1px solid rgba(37,99,235,.2);background:rgba(37,99,235,.08);white-space:nowrap;}
.nc-body{font-size:12.5px;color:var(--txt-sub);line-height:1.5;}
.nc-impact{font-size:11.5px;background:rgba(245,158,11,.1);border-left:2px solid rgba(245,158,11,.4);
  padding:5px 10px;border-radius:0 5px 5px 0;color:var(--txt-sub);line-height:1.5;}
.nc-ins-lbl{font-size:9.5px;font-weight:800;color:var(--accent);letter-spacing:.4px;margin-right:3px;white-space:nowrap;}
.tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:10.5px;padding:2px 8px;border-radius:4px;background:var(--divider);color:var(--txt-lbl);border:1px solid var(--bdr);}

/* Overseas */
.ov-card{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--divider);}
.ov-card:last-child{border-bottom:none;padding-bottom:0;}
.ov-flag{font-size:17px;line-height:1;flex-shrink:0;margin-top:2px;}
.ov-info{flex:1;min-width:0;}
.ov-name{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:2px;}
.ov-inds{font-size:10.5px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.ov-sum{font-size:11.5px;color:var(--txt-sub);line-height:1.45;}
.os{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;flex-shrink:0;margin-top:2px;}
.os.g{background:rgba(22,163,74,.1);color:var(--pos);}
.os.w{background:rgba(245,158,11,.12);color:var(--accent);}
.os.d{background:rgba(220,38,38,.1);color:var(--neg);}

/* FX */
.fx-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--divider);}
.fx-row:last-child{border-bottom:none;padding-bottom:0;}
.fx-left{display:flex;align-items:center;gap:8px;}
.fx-flag{font-size:16px;line-height:1;}
.fx-name{font-size:13px;font-weight:600;color:var(--txt);}
.fx-country{font-size:10px;color:var(--txt-lbl);}
.fx-spark{flex:1;display:flex;justify-content:center;align-items:center;margin:0 8px;min-width:80px;position:relative;}
.fx-right{text-align:right;}
.fx-val{font-size:14px;font-weight:700;color:var(--txt);}
.fx-chg{font-size:10.5px;}
.fx-chg.pos{color:var(--pos);} .fx-chg.neg{color:var(--neg);} .fx-chg.neu{color:var(--txt-lbl);}
.fx-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;
  background:var(--txt);color:var(--bg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  white-space:nowrap;pointer-events:none;z-index:50;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.fx-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--txt);}

/* Monitoring */
.mpt-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--divider);font-size:12.5px;color:var(--txt);}
.mpt-row:last-child{border-bottom:none;padding-bottom:0;}
.mpt-dot{width:5px;height:5px;border-radius:50%;background:var(--neg);flex-shrink:0;margin-top:6px;}

/* ── §5 지표 패널: 스코어카드 임베드 (카테고리 카드 그리드 + 미니 라인차트) ── */
.sc-toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0;}
.sc-toolbar .lbl{font-size:10px;color:var(--txt-lbl);font-weight:700;}
.sc-range-btn,.sc-country-btn{padding:3px 9px;border:1px solid var(--bdr);background:var(--card);border-radius:6px;
  font-size:10.5px;cursor:pointer;color:var(--txt-sub);}
.sc-range-btn.active,.sc-country-btn.active{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.sc-body{overflow-y:auto;min-height:0;flex:1;}
.sc-sct{font-size:11.5px;font-weight:800;margin:10px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--bdr);}
.sc-sct:first-child{margin-top:0;}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
.sc-card{border:1px solid var(--bdr);border-radius:9px;padding:8px 9px;background:var(--bg);}
.sc-card h4{margin:0;font-size:11px;font-weight:700;color:var(--txt);display:flex;justify-content:space-between;align-items:center;gap:4px;}
.sc-bdg{font-size:8px;padding:1px 5px;border-radius:4px;white-space:nowrap;}
.sc-bdg.obs{background:rgba(22,163,74,.14);color:var(--pos);} .sc-bdg.est{background:rgba(245,158,11,.16);color:var(--accent);}
.sc-val{font-size:15px;font-weight:800;color:var(--txt);margin:2px 0 1px;}
.sc-chg{font-size:10px;font-weight:700;}
.sc-chg.up{color:var(--neg);} .sc-chg.dn{color:var(--info);} .sc-chg.fl{color:var(--txt-sub);}
.sc-canvas-wrap{height:100px;position:relative;margin-top:4px;}
.sc-imp{font-size:9.5px;color:var(--txt-sub);background:rgba(37,99,235,.08);border-radius:5px;padding:3px 6px;margin-top:5px;line-height:1.4;}
.sc-src{font-size:8.5px;color:var(--txt-lbl);margin-top:4px;}
.sc-err{font-size:9.5px;color:var(--neg);background:rgba(220,38,38,.08);border-radius:5px;padding:3px 6px;margin-top:4px;}

/* Utility */
.empty-msg{text-align:center;padding:16px;font-size:11px;color:var(--txt-lbl);
  border:1px dashed var(--bdr);border-radius:10px;}
.skeleton{background:var(--divider);border-radius:6px;height:14px;margin:4px 0;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.up{color:var(--neg);} .dn{color:var(--info);} .fl{color:var(--txt-sub);}

/* 뉴스 국가별 헤더 + TOP3 요약/INSIGHT/ACTION 뱃지 (검수 피드백 반영) */
.news-region-hdr{font-weight:800;font-size:12px;color:var(--accent);
  margin:10px 0 2px;padding-bottom:3px;border-bottom:1.5px solid var(--bdr);}
.news-region-hdr:first-child{margin-top:0;}
.top3-reason .tr-seg{display:block;margin-top:5px;line-height:1.5;}
.top3-reason .tr-seg.tr-lead{margin-top:0;}
.top3-reason .tr-seg.tr-trend{color:var(--txt-lbl);font-size:.95em;}
.tr-label{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;
  padding:1px 6px;border-radius:4px;margin-right:5px;vertical-align:middle;}
.tr-lead .tr-label{background:var(--divider);color:var(--txt-lbl);}
.tr-impact .tr-label{background:rgba(37,99,235,.12);color:var(--info);}
.tr-action .tr-label{background:rgba(220,38,38,.1);color:var(--neg);}
.tr-trend .tr-label{background:rgba(245,158,11,.14);color:var(--accent);}
</style>
</head>
<body>

<!-- ── Theme Toggle ── -->
<button class="theme-toggle" id="theme-btn" aria-label="다크/라이트 전환" title="다크/라이트 전환">🌙</button>

<!-- ── Top Bar (헤더: 고정, 오늘의 한 줄 인라인 포함) ── -->
<div class="top-bar" id="top-bar">
  <div class="bar-left">
    <span class="bar-title">일일 경영 브리핑</span>
    <span class="bar-date" id="bar-date">—</span>
    <span class="conf">CONFIDENTIAL</span>
  </div>
  <div class="bar-right">
    <span class="bar-date" style="border-left:none;padding-left:0;" title="기획팀 내부 자료 · AI 자동 생성">검수: 이승환 선임</span>
    <a class="nav-btn" href="briefing.html" target="_blank" rel="noopener" title="전체 경영 보고서 (모바일)">📋 전체보고서</a>
    <a class="nav-btn" href="archive.html" target="_blank" rel="noopener" title="날짜별 브리핑 아카이브">📅 아카이브</a>
    <a class="nav-btn score" href="scorecard.html" target="_blank" rel="noopener" title="신신사 경영지표 스코어보드">📈 경영지표 스코어보드</a>
  </div>
</div>

<div class="app-grid">
  <div class="main-row">

    <!-- ── 열A(좌): 🔍한줄 → 📌핵심지표 → 🌐환율 → 🌏해외 → 🎯모니터링 ── -->
    <div class="col">
      <div class="card card-fixed oneline-box" id="oneline-section">
        <div class="oneline-label">🔍 오늘의 한 줄</div>
        <div class="oneline-text" id="summary-text" title="">로딩 중…</div>
      </div>
      <div class="card card-fixed" id="kpi-section">
        <div class="sec-label"><span class="sec-dot"></span>📌 핵심 지표</div>
        <div class="kpi-row" id="exec-kpi-row">
          <div class="skeleton" style="height:60px"></div>
          <div class="skeleton" style="height:60px"></div>
          <div class="skeleton" style="height:60px"></div>
        </div>
      </div>
      <div class="card card-fixed" id="fx-section">
        <div class="sec-label"><span class="sec-dot"></span>🌐 국가별 환율 (vs USD)</div>
        <div id="fx-list"></div>
      </div>
      <div class="card card-fixed" id="overseas-section">
        <div class="sec-label"><span class="sec-dot"></span>🌏 해외 모니터링</div>
        <div class="col-scroll" style="min-height:0;display:flex;flex-direction:column;">
          <div id="ov-list"></div>
        </div>
      </div>
      <div class="card card-grow" id="monitoring-section">
        <div class="sec-label"><span class="sec-dot"></span>🎯 단기 모니터링 포인트</div>
        <div class="col-scroll" id="mpt-list" style="min-height:0;"></div>
      </div>
    </div>

    <!-- ── 열B(중): TOP3(요약/INSIGHT/ACTION) + KPI + 📊지표(스코어카드) ── -->
    <div class="col">
      <div class="card card-fixed" id="exec-section">
        <div class="sec-label"><span class="sec-dot"></span>★ 주목 이슈 TOP 3</div>
        <div class="top3-list" id="top3-list" style="overflow-y:visible;">
          <div class="skeleton" style="height:60px"></div>
          <div class="skeleton" style="height:60px"></div>
          <div class="skeleton" style="height:60px"></div>
        </div>
      </div>
      <div class="card card-grow" id="indicators-section">
        <div class="sec-label"><span class="sec-dot"></span>📊 주요 경제 지표</div>
        <div class="sc-toolbar" style="justify-content:space-between;">
          <div id="sc-country-bar" style="display:flex;gap:5px;flex-wrap:wrap;">
            <button data-country="GLOBAL" class="sc-country-btn active">GLOBAL</button>
            <button data-country="KR" class="sc-country-btn">🇰🇷 KR</button>
            <button data-country="TH" class="sc-country-btn">🇹🇭 TH</button>
            <button data-country="CN" class="sc-country-btn">🇨🇳 CN</button>
            <button data-country="EG" class="sc-country-btn">🇪🇬 EG</button>
          </div>

/* ══════════════════════════════════════════════
   데이터 & 렌더링 (Briefing.* 순수 헬퍼 재사용)
   ※ 전체화면 고정 레이아웃이라 페이지 스크롤이 없음 — 칩내비/스크롤스파이 제거(§6).
══════════════════════════════════════════════ */
let _allNews = [], _cur = 'all', _fxSeries = [];

/* ── 임원 요약 카드: 요약/INSIGHT/ACTION/추세 라벨 뱃지 분리 (§1) ──
   reason 형식: "…요약. 💡신신사 시사점 — … ➡️그래서 무엇을 — … 추세 — …" */
function shortBody(s){
  s = (s||'').trim(); if(s.length<=110) return s;
  var cut = s.slice(0,110);
  var p = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('다. '), cut.lastIndexOf('음. '), cut.lastIndexOf('요. '));
  if(p>55) return s.slice(0,p+1);
  return cut.replace(/\s+\S*$/,'') + '…';
}
function fmtReason(reason){
  var s = (reason||'').trim(); if(!s) return '';
  var marks=['💡','➡️','추세 —','추세—']; var pts=[];
  marks.forEach(function(m){ var i=s.indexOf(m); if(i>=0) pts.push(i); });
  pts=pts.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  function labelFor(cls){
    if(cls==='tr-impact') return 'INSIGHT';
    if(cls==='tr-action') return 'ACTION';
    if(cls==='tr-trend') return '추세';
    return '요약';
  }
  function stripPrefix(seg, cls){
    if(cls==='tr-impact') return seg.replace(new RegExp('^💡\\s*신신사\\s*시사점\\s*[—-]?\\s*'),'');
    if(cls==='tr-action') return seg.replace(new RegExp('^➡️\\s*그래서\\s*무엇을\\s*[—-]?\\s*'),'');
    if(cls==='tr-trend') return seg.replace(new RegExp('^추세\\s*[—-]?\\s*'),'');
    return seg;
  }
  if(!pts.length) return '<span class="tr-seg tr-lead"><span class="tr-label">'+labelFor('tr-lead')+'</span>'+s+'</span>';
  var out=[]; var lead=s.slice(0,pts[0]).trim();
  if(lead) out.push('<span class="tr-seg tr-lead"><span class="tr-label">'+labelFor('tr-lead')+'</span>'+lead+'</span>');
  for(var k=0;k<pts.length;k++){
    var seg=s.slice(pts[k], k+1<pts.length?pts[k+1]:s.length).trim();
    var cls = seg.indexOf('💡')===0?'tr-impact':(seg.indexOf('➡️')===0?'tr-action':'tr-trend');
    if(cls==='tr-action'||cls==='tr-trend') continue;   // 대시보드는 요약+INSIGHT만(ACTION·추세는 전체보고서에서)
    var body = stripPrefix(seg, cls);
    out.push('<span class="tr-seg '+cls+'"><span class="tr-label">'+labelFor(cls)+'</span>'+body+'</span>');
  }
  return out.join('');
}

/* ── 환율 (sparkline) ── */
function fxMockHistory(baseStr, changeStr, currency){
  const n=7, base=parseFloat(String(baseStr||0).replace(/,/g,''))||1;
  const match = changeStr ? changeStr.match(/([\d.]+)%/) : null;
  const pct = match ? parseFloat(match[1])/100 : 0.002;
  const isUp = changeStr && changeStr.includes('▲');
  const start = base*(isUp?1-pct*6:1+pct*6);
  const seed=(currency||'X').charCodeAt(0);
  return Array.from({length:n},(_,i)=>{
    const t=i/(n-1), main=start+(base-start)*t;
    return main + Math.sin(i*1.4+seed*0.07)*base*0.003;
  });
}
function fxSparklineSVG(values, isNeg, idx){
  const W=130,H=38,PX=5,PY=6;
  const min=Math.min(...values),max=Math.max(...values),range=max-min||values[0]*0.001||1,n=values.length;
  const colorHex=isNeg?'#dc2626':'#16a34a';
  const px=i=>PX+i/(n-1)*(W-PX*2), py=v=>PY+(1-(v-min)/range)*(H-PY*2);
  const pts=values.map((v,i)=>({x:px(i),y:py(v)}));
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=1;i<n;i++){
    const cpx=((pts[i-1].x+pts[i].x)/2).toFixed(1);
    d+=` C ${cpx} ${pts[i-1].y.toFixed(1)}, ${cpx} ${pts[i].y.toFixed(1)}, ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
  }
  const fillD=`${d} L ${pts[n-1].x.toFixed(1)} ${H} L ${pts[0].x.toFixed(1)} ${H} Z`;
  const dots=pts.map(({x,y},i)=>i===n-1
    ?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${colorHex}"/>`
    :`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${colorHex}" opacity="0.4"/>`
  ).join('');
  return `<svg id="fxsp-${idx}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="touch-action:none;cursor:pointer;overflow:visible;">
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" pointer-events="all"/>
    <path d="${fillD}" fill="${colorHex}" opacity="0.09"/>
    <path d="${d}" fill="none" stroke="${colorHex}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}
function renderFX(items){
  _fxSeries=[];
  document.getElementById('fx-list').innerHTML=(items||[]).map((f,i)=>{
    const _h=f.history;
    const hist=(_h&&_h.values&&_h.values.length>=2)?_h.values
      :(Array.isArray(_h)&&_h.length>=2)?_h
      :fxMockHistory(f.rate_usd||f.value, f.change, f.currency);
    let labels=(_h&&_h.labels&&_h.labels.length===hist.length)?_h.labels:null;
    if(!labels) labels=hist.map((_,k)=>k===hist.length-1?'오늘':`D-${hist.length-1-k}`);
    _fxSeries[i]={values:hist,labels:labels};
    const spark=fxSparklineSVG(hist, f.dir==='neg', i);
    return `<div class="fx-row">
      <div class="fx-left">
        <span class="fx-flag">${f.flag||''}</span>
        <div><div class="fx-name">${f.currency}</div><div class="fx-country">${f.country}</div></div>
      </div>
      <div class="fx-spark">${spark}<div class="fx-tooltip" id="fxtt-${i}"></div></div>
      <div class="fx-right">
        <div class="fx-val">${f.rate_usd||f.value||'—'}</div>
        <div class="fx-chg ${f.dir||'neu'}">${f.change}</div>
      </div>
    </div>`;
  }).join('');
  (items||[]).forEach((_,i)=>bindFXTip(i));
}
function bindFXTip(i){
  const svg=document.getElementById('fxsp-'+i),tip=document.getElementById('fxtt-'+i),s=_fxSeries[i];
  if(!svg||!tip||!s)return;
  const values=s.values,labels=s.labels,n=values.length,W=130,PX=5;
  const pxOf=k=>PX+k/(n-1)*(W-PX*2);
  let hideT;
  function fmt(v){const num=parseFloat(v);if(isNaN(num))return v;return num>=100?num.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}):num.toFixed(2);}
  function show(clientX){
    const rect=svg.getBoundingClientRect(),sparkRect=svg.parentElement.getBoundingClientRect();
    const sw=rect.width||W,svgX=(clientX-rect.left)/sw*W;
    let best=0,bd=Infinity;
    for(let k=0;k<n;k++){const dd=Math.abs(pxOf(k)-svgX);if(dd<bd){bd=dd;best=k;}}
    tip.textContent=(labels[best]!=null?labels[best]:('D'+best))+' · '+fmt(values[best]);
    tip.style.left=((rect.left-sparkRect.left)+pxOf(best)/W*sw)+'px';
    tip.style.display='block';
  }
  function hide(){tip.style.display='none';}
  svg.addEventListener('pointerdown',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointermove',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;hideT=setTimeout(hide,1800);});
  svg.addEventListener('pointercancel',()=>{hideT=setTimeout(hide,1200);});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide();});
}

const SC_CATEGORY_ORDER = ["환율","원가·원자재","시장·지수","경기·심리","제조업","금융·물가","무역","국가리스크"];
const SC_ACCENT = { "원가·원자재":"#dc2626", "환율":"#2563eb", "시장·지수":"#0891b2", "경기·심리":"#0d9488",
                    "제조업":"#0284c7", "금융·물가":"#7c3aed", "무역":"#16a34a", "국가리스크":"#b45309" };
let SC_RANGE = 24, SC_COUNTRY = 'GLOBAL', SC_ASOF = null, SC_DATA = null;
const SC_CHARTS = {};

function scDrawChart(canvasId, points, color, neutral, unit){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(SC_CHARTS[canvasId]) SC_CHARTS[canvasId].destroy();
  const labels = points.map(p=>p[0]), values = points.map(p=>p[1]), obs = points.map(p=>p[2]);
  const ds = [{ data:values, borderColor:color, backgroundColor:color+'1e', tension:0.2,
    pointStyle: obs.map(o=>o?'circle':'rectRot'),
    pointRadius: obs.map(()=> points.length>60?0:2),
    pointBackgroundColor: obs.map(o=>o?color:'rgba(156,163,175,0.7)'),
    fill:true, order:2, borderWidth:1.5 }];
  if(neutral!=null) ds.push({ data:labels.map(()=>neutral), borderColor:'#9ca3af', borderDash:[5,4], borderWidth:1, pointRadius:0, fill:false, order:1 });
  SC_CHARTS[canvasId] = new Chart(ctx, { type:'line', data:{labels,datasets:ds},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{
        afterLabel:(c)=> c.datasetIndex===0 ? (obs[c.dataIndex]?'● 관측':'◇ 추정') : null }}},
      scales:{ x:{ ticks:{font:{size:8},color:'#9ca3af',maxRotation:0,autoSkip:true,maxTicksLimit:5}, grid:{display:false} },
               y:{ ticks:{font:{size:8},color:'#9ca3af',callback:v=>Scorecard.formatValue(v,'')}, grid:{color:'rgba(128,128,128,.12)'} } } } });
}

function scCardHtml(ind){
  const ci = Scorecard.changeInfo(ind.history);
  const cls = ci.up==null?'fl':(ci.up?'up':'dn'), arrow = ci.up==null?'—':(ci.up?'▲':'▼');
  const chg = ci.pct==null?'—':(arrow+' '+(ci.pct>=0?'+':'')+ci.pct.toFixed(2)+'%');
  const hasData = ind.history && ind.history.some(p=>p[1]!=null);
  const anyEst = (ind.history||[]).some(p=>p[2]===false);
  const badge = !hasData?'' : (anyEst?'<span class="sc-bdg est">◇ 추정포함</span>':'<span class="sc-bdg obs">● 관측</span>');
  return '<div class="sc-card">'
    + '<h4><span>'+ind.label+'</span>'+badge+'</h4>'
    + (hasData ? '<div class="sc-val">'+Scorecard.formatValue(ci.latest,ind.unit)+' <span class="sc-chg '+cls+'">'+chg+'</span></div>'
                 + '<div class="sc-canvas-wrap"><canvas id="sc_ch_'+ind.id+'"></canvas></div>'
               : '<div class="sc-err">데이터 없음'+(ind._error?(' ('+ind._error+')'):'')+'</div>')
    + (ind.impact ? '<div class="sc-imp">💡 '+ind.impact+'</div>' : '')
    + '<div class="sc-src">출처: '+(ind.source||'')+'</div></div>';
}

function scRender(){
  if(!SC_DATA) return;
  const inds = SC_DATA.indicators.filter(function(i){ return (i.country||'GLOBAL')===SC_COUNTRY; });
  const groups = Scorecard.groupByCategory(inds, SC_CATEGORY_ORDER);
  const root = document.getElementById('sc-body');
  if(!groups.length){ root.innerHTML = '<div class="empty-msg">지표 데이터 없음</div>'; return; }
  root.innerHTML = groups.map(function(g){
    return '<div class="sc-sct" style="border-color:'+(SC_ACCENT[g[0]]||'#e5e7eb')+'">'+g[0]+'</div>'
         + '<div class="sc-grid">'+g[1].map(scCardHtml).join('')+'</div>';
  }).join('');
  groups.forEach(function(g){ g[1].forEach(function(ind){
    if(!(ind.history && ind.history.some(p=>p[1]!=null))) return;
    const pts = Scorecard.aggregate(Scorecard.filterRange(ind.history, SC_RANGE, SC_ASOF), 'month');
    scDrawChart('sc_ch_'+ind.id, pts, SC_ACCENT[g[0]]||'#111827', ind.neutral, ind.unit||'');
  });});
}

async function loadScorecard(){
  try{
    const r = await fetch(`indicators.json?t=${Date.now()}`);
    const data = await r.json();
    SC_DATA = data;
    SC_ASOF = (data.generated_at || SC_ASOF || '').slice(0,10) || new Date().toISOString().slice(0,10);
    scRender();
  }catch(e){
    console.warn('indicators.json 로드 실패:', e);
    document.getElementById('sc-body').innerHTML = '<div class="empty-msg">지표 로딩 실패</div>';
  }
}
document.getElementById('sc-toolbar').addEventListener('click', function(e){
  const b = e.target.closest('.sc-range-btn');
  if(!b) return;
  document.querySelectorAll('.sc-range-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  SC_RANGE = parseInt(b.dataset.range, 10);
  scRender();
});
document.getElementById('sc-country-bar').addEventListener('click', function(e){
  const b = e.target.closest('.sc-country-btn');
  if(!b) return;
  document.querySelectorAll('.sc-country-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  SC_COUNTRY = b.dataset.country;
  scRender();
});

/* ══════════════════════════════════════════════
   메인 데이터 로드 (5분 폴링)
══════════════════════════════════════════════ */
async function load(){
  try{
    const r = await fetch(`data.json?t=${Date.now()}`);
    const d = await r.json();
    document.getElementById('bar-date').textContent = d.date_kr || d.date || '—';
    document.getElementById('bar-date').title = '발행: ' + (d.generated_at || '—');

    renderExec(d);
    _allNews = d.news || [];
    updateBadges(_allNews);
    renderNews(_cur);
    renderOverseas(d.overseas || []);
    renderMonitoring(d.monitoring || []);
    renderFX(d.fx || []);
  }catch(e){
    console.error('data.json 로드 실패:', e);
    document.getElementById('bar-date').textContent = '데이터 로드 실패';
  }
}

document.getElementById('fbar').addEventListener('click', e=>{
  const b = e.target.closest('.fb');
  if(b && !b.classList.contains('empty')) renderNews(b.dataset.f);
});

load();
loadScorecard();
setInterval(load, 300000);
</script>
