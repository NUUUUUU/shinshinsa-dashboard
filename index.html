<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신신사 일일 경영 브리핑</title>
<link rel="stylesheet" href="briefing/tokens.css">
<script>
/* §4-5 다크 토글 IIFE — DOM 렌더 전 적용 */
(function(){
  var saved = localStorage.getItem('theme');
  if(saved){ document.documentElement.dataset.theme = saved; }
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches){
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="briefing/render.js"></script>
<style>
/* ── 데스크톱 대시보드 전용 레이아웃·컴포넌트 (briefing/tokens.css 변수 사용) ── */
*{margin:0;padding:0;}
html{font-size:16px;}
body{line-height:1.55;}

/* Top bar */
.top-bar{background:var(--card);border-bottom:1px solid var(--bdr);
  padding:10px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;}
.bar-left{display:flex;align-items:center;gap:16px;}
.bar-title{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.3px;}
.bar-date{font-size:14px;color:var(--txt-sub);padding-left:14px;border-left:1px solid var(--bdr);}
.conf{font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:.6px;
  background:rgba(220,38,38,.1);color:var(--neg);border:1px solid rgba(220,38,38,.25);}
.bar-right{display:flex;align-items:center;gap:10px;}
.nav-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;
  font-size:12px;font-weight:600;background:var(--bg);color:var(--txt-body);text-decoration:none;
  border:1px solid var(--bdr);white-space:nowrap;}
.nav-btn:hover{border-color:var(--info);color:var(--info);}
.nav-btn.score{background:rgba(37,99,235,.1);color:var(--info);border-color:rgba(37,99,235,.25);}

/* Chip nav bar — §4-1 (데스크톱 상단 스티키) */
.chipbar{position:sticky;top:53px;z-index:100;background:var(--bg);
  border-bottom:1px solid var(--divider);
  padding:9px 28px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.chipbar::-webkit-scrollbar{display:none;}

/* Page layout */
.wrap{max-width:1180px;margin:0 auto;padding:16px 28px 28px;}
.sec-label{font-size:11px;font-weight:700;color:var(--txt-lbl);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.card{margin-bottom:14px;}

/* 2단 메인 그리드 (데스크톱 와이드) */
.dash-row{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start;}
.dash-row .card{margin-bottom:0;}
.dash-stack{display:flex;flex-direction:column;gap:14px;}
@media(max-width:900px){ .dash-row{grid-template-columns:1fr;} }

/* ★ Executive summary card */
.exec-hero{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);
  border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.exec-hero-lbl{font-size:11px;font-weight:700;color:var(--neg);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.exec-hero-text{font-size:17px;font-weight:500;color:var(--txt);line-height:1.6;}
.top3-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.top3-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;
  background:var(--bg);border-radius:9px;border:1px solid var(--bdr);}
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:1px;}
.r1{background:rgba(220,38,38,.12);color:var(--neg);}
.r2{background:rgba(245,158,11,.15);color:var(--accent);}
.r3{background:rgba(37,99,235,.1);color:var(--info);}
.top3-title{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:3px;line-height:1.35;}
.top3-reason{font-size:12px;color:var(--txt-sub);line-height:1.5;}

/* KPI cells */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.kpi-cell{background:var(--bg);border-radius:10px;padding:13px 15px;border-left:3px solid var(--txt-lbl);}
.kpi-cell.pos{border-left-color:var(--pos);}
.kpi-cell.neg{border-left-color:var(--neg);}
.kpi-cell.gld,.kpi-cell.neu{border-left-color:var(--accent);}
.kl{font-size:11px;color:var(--txt-lbl);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.kv{font-size:26px;font-weight:800;color:var(--txt);line-height:1.15;}
.kv sup{font-size:13px;font-weight:400;color:var(--txt-sub);}
.kc{font-size:13px;margin-top:3px;font-weight:600;}
.kc.pos{color:var(--pos);} .kc.neg{color:var(--neg);} .kc.neu,.kc.gld{color:var(--accent);}

/* Disclosure badge in exec card */
.disc-badge-btn{display:inline-flex;align-items:center;gap:5px;margin-top:14px;padding:7px 14px;
  background:rgba(22,101,52,.1);border:1px solid rgba(22,101,52,.25);border-radius:6px;
  font-size:13px;font-weight:600;color:var(--disc);cursor:pointer;text-decoration:none;}

/* CEO schedule */
.sched-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--divider);}
.sched-row:last-child{border-bottom:none;padding-bottom:0;}
.sched-time{font-size:12px;font-weight:700;color:var(--neg);min-width:96px;flex-shrink:0;}
.sched-title{font-size:14px;color:var(--txt);}
.sched-loc{font-size:11px;color:var(--txt-lbl);margin-top:1px;}

/* News filter chips */
.news-hdr-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.lg-links{display:none;align-items:center;gap:6px;}
.lg-active .lg-links{display:flex;}
.lg-lnk{font-size:12px;font-weight:600;color:var(--info);padding:3px 9px;border-radius:4px;
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);text-decoration:none;}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.fb{padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;
  border:1px solid var(--bdr);background:var(--card);color:var(--txt-sub);cursor:pointer;white-space:nowrap;}
.fb.active{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.fb[data-f="lg"].active{background:var(--info);border-color:var(--info);color:#fff;}
.fb.empty{opacity:.35;pointer-events:none;}
.fbdg{font-size:11px;padding:0 5px;border-radius:8px;background:rgba(128,128,128,.18);}
.fb.active .fbdg{background:rgba(255,255,255,.3);}

/* News cards — 2단 그리드 (데스크톱) */
.news-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:680px){ .news-list{grid-template-columns:1fr;} }
.nc{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:13px 15px;
  border-left:3px solid var(--txt-lbl);display:flex;flex-direction:column;gap:5px;}
.nc.s3{border-left-color:var(--neg);}
.nc.s2{border-left-color:var(--accent);}
.nc-hd{display:flex;gap:8px;align-items:flex-start;}
.star{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;flex-shrink:0;margin-top:2px;}
.star.s3{background:rgba(220,38,38,.1);color:var(--neg);}
.star.s2{background:rgba(245,158,11,.12);color:var(--accent);}
.star.s1{background:var(--divider);color:var(--txt-lbl);}
.nc-title{font-size:14px;font-weight:600;color:var(--txt);line-height:1.4;}
.nc-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nc-src{font-size:11px;color:var(--txt-lbl);}
.nc-link{font-size:11px;color:var(--info);text-decoration:none;padding:1px 8px;border-radius:3px;
  border:1px solid rgba(37,99,235,.2);background:rgba(37,99,235,.08);white-space:nowrap;}
.nc-body{font-size:13px;color:var(--txt-sub);line-height:1.55;}
.nc-impact{font-size:12px;background:rgba(245,158,11,.1);border-left:2px solid rgba(245,158,11,.4);
  padding:5px 10px;border-radius:0 5px 5px 0;color:var(--txt-sub);line-height:1.5;}
.tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--divider);color:var(--txt-lbl);border:1px solid var(--bdr);}

/* Disclosure section */
.disc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:680px){ .disc-grid{grid-template-columns:1fr;} }
.disc-card{border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;border-left:3px solid var(--disc);}
.disc-company{font-size:11px;font-weight:700;color:var(--disc);margin-bottom:2px;}
.disc-stars{font-size:12px;color:var(--accent);}
.disc-title{font-size:14px;font-weight:600;color:var(--txt);margin:5px 0;line-height:1.4;}
.disc-impact{font-size:12px;color:var(--txt-sub);line-height:1.5;}
.disc-link{font-size:11px;color:var(--info);text-decoration:none;padding:2px 9px;border-radius:4px;
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);}
.disc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px;}
.fin-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.fin-table th{font-size:10px;font-weight:700;color:var(--txt-lbl);text-align:left;
  padding:7px 10px;border-bottom:1px solid var(--divider);text-transform:uppercase;}
.fin-table td{padding:8px 10px;border-bottom:1px solid var(--divider);color:var(--txt-sub);}
.fin-table tr:last-child td{border-bottom:none;}
.fin-table .fin-co{font-weight:600;color:var(--txt);}

/* Overseas */
.ov-card{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--divider);}
.ov-card:last-child{border-bottom:none;padding-bottom:0;}
.ov-flag{font-size:20px;line-height:1;flex-shrink:0;margin-top:2px;}
.ov-info{flex:1;min-width:0;}
.ov-name{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:2px;}
.ov-inds{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.ov-sum{font-size:12px;color:var(--txt-sub);line-height:1.5;}
.os{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;flex-shrink:0;margin-top:2px;}
.os.g{background:rgba(22,163,74,.1);color:var(--pos);}
.os.w{background:rgba(245,158,11,.12);color:var(--accent);}
.os.d{background:rgba(220,38,38,.1);color:var(--neg);}

/* FX */
.fx-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--divider);}
.fx-row:last-child{border-bottom:none;padding-bottom:0;}
.fx-left{display:flex;align-items:center;gap:9px;}
.fx-flag{font-size:18px;line-height:1;}
.fx-name{font-size:14px;font-weight:600;color:var(--txt);}
.fx-country{font-size:11px;color:var(--txt-lbl);}
.fx-spark{flex:1;display:flex;justify-content:center;align-items:center;margin:0 10px;min-width:120px;position:relative;}
.fx-right{text-align:right;}
.fx-val{font-size:16px;font-weight:700;color:var(--txt);}
.fx-chg{font-size:11px;}
.fx-chg.pos{color:var(--pos);} .fx-chg.neg{color:var(--neg);} .fx-chg.neu{color:var(--txt-lbl);}
.fx-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;
  background:var(--txt);color:var(--bg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  white-space:nowrap;pointer-events:none;z-index:50;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.fx-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--txt);}

/* Markets */
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mkt-cell{background:var(--bg);border-radius:9px;padding:10px 12px;}
.mkt-lbl{font-size:11px;color:var(--txt-lbl);margin-bottom:3px;}
.mkt-val{font-size:17px;font-weight:700;}
.mkt-val.pos{color:var(--pos);} .mkt-val.neg{color:var(--neg);} .mkt-val.gld{color:var(--accent);}

/* WTI */
.wti-wrap{height:130px;position:relative;margin-top:8px;}
svg.wti{width:100%;height:100%;}

/* Monitoring */
.mpt-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--divider);font-size:14px;color:var(--txt);}
.mpt-row:last-child{border-bottom:none;padding-bottom:0;}
.mpt-dot{width:6px;height:6px;border-radius:50%;background:var(--neg);flex-shrink:0;margin-top:7px;}

/* Accordion */
.acc-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:2px 0;}
.acc-arrow{font-size:14px;color:var(--txt-lbl);transition:transform .2s;}
.acc-header.open .acc-arrow{transform:rotate(180deg);}
.acc-body{overflow:hidden;transition:max-height .3s ease;max-height:0;}
.acc-body.open{max-height:4000px;}

/* Mini indicator cards (§4-3) */
.mini-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-top:12px;}
@media(max-width:900px){ .mini-grid{grid-template-columns:repeat(3,1fr);} }
@media(max-width:520px){ .mini-grid{grid-template-columns:repeat(2,1fr);} }
.mini-card{background:var(--bg);border-radius:9px;padding:10px 11px;}
.mini-lbl{font-size:10px;font-weight:700;color:var(--txt-lbl);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.mini-val{font-size:16px;font-weight:800;color:var(--txt);line-height:1.2;}
.mini-chg{font-size:11px;margin-top:2px;}
.mini-svg{margin-top:6px;display:block;width:100%;overflow:visible;}
.mini-dot{font-size:8px;margin-left:2px;}
.up{color:var(--neg);} .dn{color:var(--info);} .fl{color:var(--txt-sub);}

/* Utility */
.empty-msg{text-align:center;padding:20px;font-size:12px;color:var(--txt-lbl);
  border:1px dashed var(--bdr);border-radius:10px;}
.skeleton{background:var(--divider);border-radius:6px;height:14px;margin:4px 0;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scorecard-link{font-size:13px;font-weight:600;color:var(--info);text-decoration:none;
  display:inline-flex;align-items:center;gap:4px;margin-top:12px;}
.footer{text-align:center;padding:16px 28px;font-size:12px;color:var(--txt-lbl);
  border-top:1px solid var(--bdr);}
.footer strong{color:var(--neg);}

  /* 뉴스 국가별 헤더 + TOP3 시사점 분리 (검수 피드백 반영) */
  .news-region-hdr{grid-column:1/-1;font-weight:800;font-size:13px;color:var(--accent);
    margin:12px 0 2px;padding-bottom:4px;border-bottom:1.5px solid var(--line);}
  .news-region-hdr:first-child{margin-top:0;}
  .top3-reason .tr-seg{display:block;margin-top:5px;line-height:1.55;}
  .top3-reason .tr-seg.tr-lead{margin-top:0;}
  .top3-reason .tr-seg.tr-trend{color:var(--txt-lbl);font-size:.95em;}
</style>
</head>
<body>

<!-- ── Theme Toggle ── -->
<button class="theme-toggle" id="theme-btn" aria-label="다크/라이트 전환" title="다크/라이트 전환">🌙</button>

<!-- ── Top Bar ── -->
<div class="top-bar" id="top-bar">
  <div class="bar-left">
    <span class="bar-title">일일 경영 브리핑</span>
    <span class="bar-date" id="bar-date">—</span>
    <span class="conf">CONFIDENTIAL</span>
  </div>
  <div class="bar-right">
    <a class="nav-btn" href="briefing.html" target="_blank" rel="noopener" title="전체 경영 보고서 (모바일)">📋 전체보고서</a>
    <a class="nav-btn" href="archive.html" target="_blank" rel="noopener" title="날짜별 브리핑 아카이브">📅 아카이브</a>
    <a class="nav-btn score" href="scorecard.html" title="신신사 경영지표 스코어보드">📈 경영지표 스코어보드</a>
  </div>
</div>

<!-- ── §4-1 Chip Nav Bar ── -->
<nav class="chipbar" id="chipbar" aria-label="섹션 이동">
  <button class="chip active" data-sec="exec-section">★ 요약</button>
  <button class="chip" data-sec="news-section">📰 뉴스</button>
  <button class="chip" data-sec="disc-section">📑 공시</button>
  <button class="chip" data-sec="overseas-section">🌏 해외</button>
  <button class="chip" data-sec="market-section">📊 시장</button>
  <button class="chip" data-sec="indicators-section">🔢 지표</button>
</nav>

<div class="wrap">

  <!-- ── §4-4 ★ 임원 요약 카드 ── -->
  <div class="card" id="exec-section">
    <div class="sec-label"><span class="sec-dot"></span>★ 임원 요약</div>
    <div class="exec-hero">
      <div class="exec-hero-lbl">🔍 오늘의 한 줄</div>
      <div class="exec-hero-text" id="summary-text">
        <div class="skeleton" style="width:100%"></div>
        <div class="skeleton" style="width:70%"></div>
      </div>
    </div>
    <div class="sec-label" style="margin-bottom:8px;"><span class="sec-dot"></span>주목 이슈 TOP 3</div>
    <div class="top3-grid" id="top3-list">
      <div class="skeleton" style="height:60px"></div>
      <div class="skeleton" style="height:60px"></div>
      <div class="skeleton" style="height:60px"></div>
    </div>
    <div class="kpi-row" id="exec-kpi-row">
      <div class="skeleton" style="height:72px"></div>
      <div class="skeleton" style="height:72px"></div>
      <div class="skeleton" style="height:72px"></div>
    </div>
    <div id="exec-disc-badge"></div>
  </div>

  <!-- ── 뉴스 + 우측 레일 (CEO 일정 · 시장 · 환율) ── -->
  <div class="dash-row">
    <!-- 뉴스 -->
    <div class="card" id="news-section">
      <div class="news-hdr-row" id="news-hdr-row">
        <div class="sec-label" style="margin-bottom:0;"><span class="sec-dot"></span><span id="news-hdr-lbl">주요 뉴스</span></div>
        <div class="lg-links" id="lg-links">
          <a class="lg-lnk" href="https://live.lge.co.kr/" target="_blank" rel="noopener">LG 뉴스룸 ↗</a>
          <a class="lg-lnk" href="https://www.lge.co.kr/company/investor/IREvents" target="_blank" rel="noopener">IR ↗</a>
        </div>
      </div>
      <div class="fbar" id="fbar">
        <button class="fb active" data-f="all">전체 <span class="fbdg" id="b-all">—</span></button>
        <button class="fb" data-f="lg">🔵 LG <span class="fbdg" id="b-lg">—</span></button>
        <button class="fb" data-f="한국">🇰🇷 한국 <span class="fbdg" id="b-kr">—</span></button>
        <button class="fb" data-f="중국">🇨🇳 중국 <span class="fbdg" id="b-cn">—</span></button>
        <button class="fb" data-f="태국">🇹🇭 태국 <span class="fbdg" id="b-th">—</span></button>
        <button class="fb" data-f="이집트">🇪🇬 이집트 <span class="fbdg" id="b-eg">—</span></button>
      </div>
      <div class="news-list" id="news-list">
        <div class="skeleton" style="height:100px"></div>
        <div class="skeleton" style="height:100px"></div>
      </div>
    </div>

    <!-- 우측 레일 -->
    <div class="dash-stack">
      <div class="card" id="fx-section">
        <div class="sec-label"><span class="sec-dot"></span>🌐 국가별 환율 (vs USD)</div>
        <div id="fx-list"></div>
      </div>
      <div class="card" id="sched-section">
        <div class="sec-label"><span class="sec-dot"></span>CEO 일정</div>
        <div id="sched-list"><div class="skeleton" style="height:40px"></div></div>
      </div>
      <div class="card" id="market-section">
        <div class="sec-label"><span class="sec-dot"></span>글로벌 시장 지표</div>
        <div class="mkt-grid" id="mkt-grid"></div>
      </div>

/* ══════════════════════════════════════════════
   §4-1 칩 내비 + IntersectionObserver 스크롤스파이
══════════════════════════════════════════════ */
(function(){
  var chips = document.querySelectorAll('.chipbar .chip');
  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      var target = document.getElementById(chip.dataset.sec);
      if(!target) return;
      var accBody = target.querySelector('.acc-body');           // 접힌 아코디언이면 펼치기
      if(accBody && !accBody.classList.contains('open')){
        var hdr = target.querySelector('.acc-header');
        if(hdr) hdr.click();
      }
      target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  var secIds = Array.from(chips).map(function(c){ return c.dataset.sec; });
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var id = entry.target.id;
        chips.forEach(function(c){ c.classList.toggle('active', c.dataset.sec === id); });
      }
    });
  }, {rootMargin:'-20% 0px -60% 0px', threshold:0});
  secIds.forEach(function(id){ var el = document.getElementById(id); if(el) observer.observe(el); });
})();

function fmtReason(reason){
  var s = (reason||'').trim(); if(!s) return '';
  var marks=['💡','➡️','추세 —','추세—']; var pts=[];
  marks.forEach(function(m){ var i=s.indexOf(m); if(i>=0) pts.push(i); });
  pts=pts.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  if(!pts.length) return '<span class="tr-seg tr-lead">'+s+'</span>';
  var out=[]; var lead=s.slice(0,pts[0]).trim();
  if(lead) out.push('<span class="tr-seg tr-lead">'+lead+'</span>');
  for(var k=0;k<pts.length;k++){
    var seg=s.slice(pts[k], k+1<pts.length?pts[k+1]:s.length).trim();
    var cls = seg.indexOf('💡')===0?'tr-impact':(seg.indexOf('➡️')===0?'tr-action':'tr-trend');
    out.push('<span class="tr-seg '+cls+'">'+seg+'</span>');
  }
  return out.join('');
}

/* ── 환율 (sparkline) ── */
function fxMockHistory(baseStr, changeStr, currency){
  const n=7, base=parseFloat(String(baseStr||0).replace(/,/g,''))||1;
  const match = changeStr ? changeStr.match(/([\d.]+)%/) : null;
  const pct = match ? parseFloat(match[1])/100 : 0.002;
  const isUp = changeStr && changeStr.includes('▲');
  const start = base*(isUp?1-pct*6:1+pct*6);
  const seed=(currency||'X').charCodeAt(0);
  return Array.from({length:n},(_,i)=>{
    const t=i/(n-1), main=start+(base-start)*t;
    return main + Math.sin(i*1.4+seed*0.07)*base*0.003;
  });
}
function fxSparklineSVG(values, isNeg, idx){
  const W=130,H=38,PX=5,PY=6;
  const min=Math.min(...values),max=Math.max(...values),range=max-min||values[0]*0.001||1,n=values.length;
  const colorHex=isNeg?'#dc2626':'#16a34a';
  const px=i=>PX+i/(n-1)*(W-PX*2), py=v=>PY+(1-(v-min)/range)*(H-PY*2);
  const pts=values.map((v,i)=>({x:px(i),y:py(v)}));
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=1;i<n;i++){
    const cpx=((pts[i-1].x+pts[i].x)/2).toFixed(1);
    d+=` C ${cpx} ${pts[i-1].y.toFixed(1)}, ${cpx} ${pts[i].y.toFixed(1)}, ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
  }
  const fillD=`${d} L ${pts[n-1].x.toFixed(1)} ${H} L ${pts[0].x.toFixed(1)} ${H} Z`;
  const dots=pts.map(({x,y},i)=>i===n-1
    ?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${colorHex}"/>`
    :`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${colorHex}" opacity="0.4"/>`
  ).join('');
  return `<svg id="fxsp-${idx}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="touch-action:none;cursor:pointer;overflow:visible;">
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" pointer-events="all"/>
    <path d="${fillD}" fill="${colorHex}" opacity="0.09"/>
    <path d="${d}" fill="none" stroke="${colorHex}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}
function renderFX(items){
  _fxSeries=[];
  document.getElementById('fx-list').innerHTML=(items||[]).map((f,i)=>{
    const _h=f.history;
    const hist=(_h&&_h.values&&_h.values.length>=2)?_h.values
      :(Array.isArray(_h)&&_h.length>=2)?_h
      :fxMockHistory(f.rate_usd||f.value, f.change, f.currency);
    let labels=(_h&&_h.labels&&_h.labels.length===hist.length)?_h.labels:null;
    if(!labels) labels=hist.map((_,k)=>k===hist.length-1?'오늘':`D-${hist.length-1-k}`);
    _fxSeries[i]={values:hist,labels:labels};
    const spark=fxSparklineSVG(hist, f.dir==='neg', i);
    return `<div class="fx-row">
      <div class="fx-left">
        <span class="fx-flag">${f.flag||''}</span>
        <div><div class="fx-name">${f.currency}</div><div class="fx-country">${f.country}</div></div>
      </div>
      <div class="fx-spark">${spark}<div class="fx-tooltip" id="fxtt-${i}"></div></div>
      <div class="fx-right">
        <div class="fx-val">${f.rate_usd||f.value||'—'}</div>
        <div class="fx-chg ${f.dir||'neu'}">${f.change}</div>
      </div>
    </div>`;
  }).join('');
  (items||[]).forEach((_,i)=>bindFXTip(i));
}
function bindFXTip(i){
  const svg=document.getElementById('fxsp-'+i),tip=document.getElementById('fxtt-'+i),s=_fxSeries[i];
  if(!svg||!tip||!s)return;
  const values=s.values,labels=s.labels,n=values.length,W=130,PX=5;
  const pxOf=k=>PX+k/(n-1)*(W-PX*2);
  let hideT;
  function fmt(v){const num=parseFloat(v);if(isNaN(num))return v;return num>=100?num.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}):num.toFixed(2);}
  function show(clientX){
    const rect=svg.getBoundingClientRect(),sparkRect=svg.parentElement.getBoundingClientRect();
    const sw=rect.width||W,svgX=(clientX-rect.left)/sw*W;
    let best=0,bd=Infinity;
    for(let k=0;k<n;k++){const dd=Math.abs(pxOf(k)-svgX);if(dd<bd){bd=dd;best=k;}}
    tip.textContent=(labels[best]!=null?labels[best]:('D'+best))+' · '+fmt(values[best]);
    tip.style.left=((rect.left-sparkRect.left)+pxOf(best)/W*sw)+'px';
    tip.style.display='block';
  }
  function hide(){tip.style.display='none';}
  svg.addEventListener('pointerdown',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointermove',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;hideT=setTimeout(hide,1800);});
  svg.addEventListener('pointercancel',()=>{hideT=setTimeout(hide,1200);});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide();});
}

/* ── WTI ── */
function renderWTI(wti){
  if(!wti||(wti.values||[]).length<2)return;
  const svg=document.getElementById('wti-svg');
  const W=svg.clientWidth||340,H=130;
  const data=wti.values,labels=wti.labels||[];
  const n=data.length,minV=wti.min||Math.min(...data)-2,maxV=wti.max||Math.max(...data)+2;
  const ml=38,mr=10,mt=10,mb=24,pw=W-ml-mr,ph=H-mt-mb;
  const xs=i=>ml+(i/(n-1))*pw,ys=v=>mt+ph-((v-minV)/(maxV-minV))*ph;
  const color='#dc2626';
  let out=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  [0,.5,1].forEach(t=>{
    const v=minV+t*(maxV-minV),y=ys(v);
    out+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="rgba(128,128,128,.15)" stroke-width="1"/>`;
    out+=`<text x="${ml-4}" y="${y+4}" text-anchor="end" font-size="10" fill="rgba(128,128,128,.7)" font-family="sans-serif">${v.toFixed(0)}</text>`;
  });
  const pts=`${xs(0)},${mt+ph} ${data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ')} ${xs(n-1)},${mt+ph}`;
  out+=`<polygon points="${pts}" fill="${color}" opacity="0.12"/>`;
  out+=`<polyline points="${data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  data.forEach((v,i)=>{out+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="${color}"/>`;});
  labels.forEach((l,i)=>{
    if(n>5&&i%2!==0&&i!==n-1)return;
    out+=`<text x="${xs(i)}" y="${H-4}" text-anchor="middle" font-size="10" fill="rgba(128,128,128,.7)" font-family="sans-serif">${l}</text>`;
  });
  out+='</svg>';
  svg.outerHTML=out;
  document.getElementById('wti-lbl').textContent=`WTI 유가 (${n}거래일, USD/bbl) ${wti.trend||''}`;
}

/* ── 모니터링 ── */
function renderMonitoring(pts){
  document.getElementById('mpt-list').innerHTML=(pts||[]).map(p=>`
    <div class="mpt-row"><div class="mpt-dot"></div><div>${p}</div></div>`).join('');
}

/* ── §4-3 미니 지표 (indicators.json fetch) ── */
async function loadIndicators(){
  const miniGrid = document.getElementById('mini-grid');
  try{
    const r = await fetch(`indicators.json?t=${Date.now()}`);
    const data = await r.json();
    const inds = data.indicators || [];
    const picked = Briefing.pickMiniIndicators(inds, Briefing.MINI_IDS);
    if(!picked.length){
      miniGrid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">지표 데이터 없음</div>';
      return;
    }
    miniGrid.innerHTML = picked.map(ind=>{
      const vals = (ind.history||[]).map(h=>h[1]).filter(v=>v!=null);
      const latest = ind.latest != null ? ind.latest : (vals.length?vals[vals.length-1]:null);
      const change = ind.change;
      const isNeg = change < 0;
      const chgStr = change != null
        ? (change > 0 ? `▲ +${change.toFixed?change.toFixed(2):change}` : `▼ ${change.toFixed?change.toFixed(2):change}`)
        : '—';
      const chgCls = change > 0 ? 'up' : change < 0 ? 'dn' : 'fl';
      const W=72, H=28;
      const sparkD = vals.length>=2 ? Briefing.sparkPath(vals.slice(-20), W, H) : '';
      const latestObs = ind.history && ind.history.length ? ind.history[ind.history.length-1][2] : true;
      const dotSym = latestObs ? '●' : '◇';
      return `<div class="mini-card">
        <div class="mini-lbl">${ind.label||ind.id}</div>
        <div class="mini-val">${latest!=null?latest.toLocaleString('ko-KR',{maximumFractionDigits:2}):'—'}<small style="font-size:9px;color:var(--txt-lbl);margin-left:2px;">${ind.unit||''}</small></div>
        <div class="mini-chg ${chgCls}">${chgStr} <span class="mini-dot">${dotSym}</span></div>
        ${sparkD?`<svg class="mini-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="height:28px;">
          <path d="${sparkD}" fill="none" stroke="${isNeg?'var(--neg)':'var(--pos)'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`:''}
      </div>`;
    }).join('');
  }catch(e){
    console.warn('indicators.json 로드 실패:', e);
    miniGrid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">지표 로딩 실패</div>`;
  }
}

/* ── 아코디언 ── */
function initAccordion(hdrId, bodyId){
  const hdr = document.getElementById(hdrId);
  const body = document.getElementById(bodyId);
  if(!hdr||!body) return;
  hdr.addEventListener('click', function(){
    const isOpen = body.classList.toggle('open');
    hdr.classList.toggle('open', isOpen);
    hdr.setAttribute('aria-expanded', isOpen);
  });
}

/* ══════════════════════════════════════════════
   메인 데이터 로드 (5분 폴링)
══════════════════════════════════════════════ */
async function load(){
  try{
    const r = await fetch(`data.json?t=${Date.now()}`);
    const d = await r.json();
    document.getElementById('bar-date').textContent = d.date_kr || d.date || '—';
    document.getElementById('footer-ts').textContent = '발행: ' + (d.generated_at || '—');

    renderExec(d);
    renderSched(d.ceo_schedule || []);
    _allNews = d.news || [];
    updateBadges(_allNews);
    renderNews(_cur);
    renderDisclosures(d);
    renderOverseas(d.overseas || []);
    renderFX(d.fx || []);
    renderMarkets(d.markets || []);
    setTimeout(()=>renderWTI(d.wti), 100);
    renderMonitoring(d.monitoring || []);
  }catch(e){
    console.error('data.json 로드 실패:', e);
    document.getElementById('bar-date').textContent = '데이터 로드 실패';
  }
}

document.getElementById('fbar').addEventListener('click', e=>{
  const b = e.target.closest('.fb');
  if(b && !b.classList.contains('empty')) renderNews(b.dataset.f);
});

initAccordion('indicators-acc-hdr', 'indicators-acc-body');

load();
loadIndicators();
setInterval(load, 300000);
</script>
