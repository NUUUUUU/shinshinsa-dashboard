<script>
/* ══════════════════════════════════════════════
   §4-5 다크 토글 — 런타임 핸들러
══════════════════════════════════════════════ */
(function(){
  var btn = document.getElementById('theme-btn');
  function updateIcon(){
    if(!btn) return;
    btn.innerHTML = '<i data-lucide="'+(document.documentElement.dataset.theme==='dark'?'sun':'moon')+'"></i>';
    if(window.lucide) lucide.createIcons();
  }
  updateIcon();
  btn.addEventListener('click', function(){
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
    updateIcon();
    /* 그래프는 그릴 때 CSS 변수를 읽어 색을 굳힌다 → 테마가 바뀌면 다시 그려야 한다.
       안 그러면 다크에서 선만 라이트 색으로 남는다 (2026-09-04 실측). */
    if(window.__redrawCharts) window.__redrawCharts();
  });
})();

/* ══════════════════════════════════════════════
   데이터 & 렌더링 (Briefing.* 순수 헬퍼 재사용)
   ※ 전체화면 고정 레이아웃이라 페이지 스크롤이 없음 — 칩내비/스크롤스파이 제거(§6).
══════════════════════════════════════════════ */
let _allNews = [], _cur = 'all', _fxSeries = [];

/* ── 임원 요약 카드: 요약/INSIGHT/ACTION/추세 라벨 뱃지 분리 (§1) ──
   reason 형식: "…요약. 💡신신사 시사점 — … ➡️그래서 무엇을 — … 추세 — …" */
function shortBody(s){
  s = (s||'').trim(); if(s.length<=110) return s;
  var cut = s.slice(0,110);
  var p = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('다. '), cut.lastIndexOf('음. '), cut.lastIndexOf('요. '));
  if(p>55) return s.slice(0,p+1);
  return cut.replace(/\s+\S*$/,'') + '…';
}
// TOP3 reason 렌더는 briefing/render.js?v=202609220900 로 옮겼다 (2026-09-10).
// 두 페이지에 서로 다른 두 벌이 있어서 한쪽만 고쳐지는 사고를 막는다.
function fmtReason(reason){ return Briefing.fmtReason(reason, mdBold); }

function renderExec(d){
  const summaryEl = document.getElementById('summary-text');
  const summaryText = d.summary_line || (() => {
    const inf = (d.kpis||[]).find(k=>k.type==='inf');
    return inf ? inf.summary || '—' : '—';
  })();
  summaryEl.textContent = summaryText;
  summaryEl.title = summaryText;

  const rc = ['r1','r2','r3'];
  document.getElementById('top3-list').innerHTML = (d.top3||[]).map((t,i)=>`
    <div class="top3-item">
      <div class="rank-badge ${rc[i]||'r3'}">${t.rank}</div>
      <div>
        <div class="top3-title">${t.title}</div>
        <div class="top3-reason">${fmtReason(t.reason)}</div>
      </div>
    </div>`).join('');

  const kpis = (d.kpis||[]).filter(k=>k.type!=='inf').slice(0,3);
  document.getElementById('exec-kpi-row').innerHTML = kpis.map(k=>{
    const cls = Briefing.kpiClass(k.type);
    return `
      <div class="kpi-cell ${cls}">
        <div class="kl">${k.label}</div>
        <div class="kv">${k.value||'—'}${k.unit?`<sup>${k.unit}</sup>`:''}</div>
        <div class="kc ${cls}">${k.change||''}</div>
        ${k.note?`<div class="ki">${k.note}</div>`:''}
      </div>`;
  }).join('');
}

/* ── CEO 일정 ── */
function renderSched(sched){
  if(!sched || !sched.length){
    document.getElementById('sched-list').innerHTML =
      '<div style="font-size:13px;color:var(--txt-lbl);padding:8px 0;">금일 등록된 일정이 없습니다.</div>';
    return;
  }
  document.getElementById('sched-list').innerHTML = sched.map(s=>`
    <div class="sched-row">
      <div class="sched-time">${s.time || (s.start ? s.start+(s.end?'~'+s.end:'') : '')}</div>
      <div>
        <div class="sched-title">${s.title}</div>
        ${s.location ? `<div class="sched-loc">${s.location}</div>` : ''}
      </div>
    </div>`).join('');
}

/* ── 뉴스 (Briefing.filterNews + Briefing.stars) ── */
/* 테마 전환 시 그래프 다시 그리기 — 색을 CSS 변수에서 읽기 때문이다. */
window.__redrawCharts = function(){
  try{ if(window.__lastFX && window.__lastFX.length) renderFX(window.__lastFX); }catch(e){}
  try{ if(SC_VIEW) SC_VIEW.redraw(); }catch(e){}
};
function _annotateNews(){
  if(window.Annotate) Annotate.run(['news-list'], {cap:2});
}
function renderNews(f){
  _cur = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  const newsHdr = document.getElementById('news-hdr-row');
  newsHdr.classList.toggle('lg-active', f==='lg');

  const cs = {3:'s3',2:'s2',1:'s1'};
  const byImp = (a,b)=>(b.importance||0)-(a.importance||0);
  const region = n => Briefing.classifyNews(n);
  const lbl = document.getElementById('news-hdr-lbl');
  let items;
  if(f==='all'){
    lbl.textContent = `주요 뉴스 · 전체 ${_allNews.length}건 (국가별)`;
    const order = {'한국':0,'중국':1,'태국':2,'이집트':3};
    items = _allNews.slice().sort((a,b)=>{
      const ra=order[region(a)], rb=order[region(b)];
      return ra!==rb ? ra-rb : byImp(a,b);
    });
  } else {
    items = Briefing.filterNews(_allNews, f).slice().sort(byImp);
    lbl.textContent = `주요 뉴스 · ${items.length}건`;
  }

  if(!items.length){
    document.getElementById('news-list').innerHTML =
      '<div class="empty-msg" style="grid-column:1/-1;">해당 카테고리 뉴스가 없습니다.</div>';
    return;
  }
  let _lastR = null;
  document.getElementById('news-list').innerHTML = items.map(n=>{
    let _hdr = '';
    if(f==='all'){ const r=region(n); if(r!==_lastR){ _lastR=r; _hdr=`<div class="news-region-hdr">${r} · ${items.filter(x=>region(x)===r).length}건</div>`; } }
    return _hdr + `
    <div class="nc ${cs[n.importance]||'s1'}">
      <div class="nc-hd">
        <span class="star ${cs[n.importance]||'s1'}">${Briefing.stars(n.importance)}</span>
        <div class="nc-title">${n.title}${n.translated&&n.id
          ?` <a href="translated.html?id=${encodeURIComponent(n.id)}&from=index.html" target="_blank" rel="noopener"
              style="font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
              border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap;text-decoration:none;">번역</a>`
          :(n.translated?` <span style="font-size:10px;font-weight:700;color:var(--accent);
              border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px;">번역</span>`:'')}
        </div>
      </div>
      ${n.translated&&n.title_orig
        ?`<div style="font-size:11px;color:var(--txt-lbl);margin:-2px 0 2px 0;">원제: ${n.title_orig}</div>`:''}
      <div class="nc-meta">
        <span class="nc-src">${n.source} · ${n.pubDate}</span>
        ${n.url?`<a class="nc-link" href="${n.url}" target="_blank" rel="noopener">원문 ↗</a>`:''}
      </div>
      <div class="nc-body">${shortBody(n.body)}</div>
      ${n.impact?`<div class="nc-impact"><span class="nc-ins-lbl">INSIGHT</span>${mdBold(n.impact)}</div>`:''}
      <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
  _annotateNews();
}

function updateBadges(news){

/* ── 환율 (sparkline) ── */
function fxMockHistory(baseStr, changeStr, currency){
  const n=7, base=parseFloat(String(baseStr||0).replace(/,/g,''))||1;
  const match = changeStr ? changeStr.match(/([\d.]+)%/) : null;
  const pct = match ? parseFloat(match[1])/100 : 0.002;
  const isUp = changeStr && changeStr.includes('▲');
  const start = base*(isUp?1-pct*6:1+pct*6);
  const seed=(currency||'X').charCodeAt(0);
  return Array.from({length:n},(_,i)=>{
    const t=i/(n-1), main=start+(base-start)*t;
    return main + Math.sin(i*1.4+seed*0.07)*base*0.003;
  });
}
/* 구현은 briefing/charts.js?v=202609220900 로 옮겼다 — 두 화면이 같은 그래프를 쓴다. */
function fxSparklineSVG(values, isNeg, idx){
  return window.BriefingCharts ? BriefingCharts.fxSparkline(values, isNeg, idx) : '';
}

function renderFX(items){
  window.__lastFX = items || [];   // 테마 전환 시 다시 그리려면 원본이 필요하다
  _fxSeries=[];
  document.getElementById('fx-list').innerHTML=(items||[]).map((f,i)=>{
    const _h=f.history;
    const hist=(_h&&_h.values&&_h.values.length>=2)?_h.values
      :(Array.isArray(_h)&&_h.length>=2)?_h
      :fxMockHistory(f.rate_usd||f.value, f.change, f.currency);
    let labels=(_h&&_h.labels&&_h.labels.length===hist.length)?_h.labels:null;
    if(!labels) labels=hist.map((_,k)=>k===hist.length-1?'오늘':`D-${hist.length-1-k}`);
    _fxSeries[i]={values:hist,labels:labels};
    const spark=fxSparklineSVG(hist, f.dir==='neg', i);
    return `<div class="fx-row">
      <div class="fx-left">
        <div class="fx-name">${Briefing.fxPairLabel ? Briefing.fxPairLabel(f) : (f.country||f.currency||'')}</div>
      </div>
      <div class="fx-spark">${spark}<div class="fx-tooltip" id="fxtt-${i}"></div></div>
      <div class="fx-right">
        <div class="fx-val">${f.rate_usd||f.value||'—'}</div>
        <div class="fx-chg ${f.dir||'neu'}">${f.change}</div>
      </div>
    </div>`;
  }).join('');
  (items||[]).forEach((_,i)=>bindFXTip(i));
}
function bindFXTip(i){
  const svg=document.getElementById('fxsp-'+i),tip=document.getElementById('fxtt-'+i),s=_fxSeries[i];
  if(!svg||!tip||!s)return;
  const values=s.values,labels=s.labels,n=values.length,W=130,PX=5;
  const pxOf=k=>PX+k/(n-1)*(W-PX*2);
  let hideT;
  function fmt(v){const num=parseFloat(v);if(isNaN(num))return v;return num>=100?num.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}):num.toFixed(2);}
  function show(clientX){
    const rect=svg.getBoundingClientRect(),sparkRect=svg.parentElement.getBoundingClientRect();
    const sw=rect.width||W,svgX=(clientX-rect.left)/sw*W;
    let best=0,bd=Infinity;
    for(let k=0;k<n;k++){const dd=Math.abs(pxOf(k)-svgX);if(dd<bd){bd=dd;best=k;}}
    tip.textContent=(labels[best]!=null?labels[best]:('D'+best))+' · '+fmt(values[best]);
    tip.style.left=((rect.left-sparkRect.left)+pxOf(best)/W*sw)+'px';
    tip.style.display='block';
  }
  function hide(){tip.style.display='none';}
  svg.addEventListener('pointerdown',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointermove',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;hideT=setTimeout(hide,1800);});
  svg.addEventListener('pointercancel',()=>{hideT=setTimeout(hide,1200);});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide();});
}

    const guides = await fetch(`indicator_guide.json?t=${Date.now()}`)
      .then(r => r.ok ? r.json() : {guides:{}}).catch(() => ({guides:{}}));
    SC_VIEW = ScorecardView.mount(document.getElementById('sc-body'), await r.json(), {compact:true, guides: guides.guides});

    console.warn('indicators.json 로드 실패:', e);
    document.getElementById('sc-body').innerHTML = '<div class="empty-msg">지표 로딩 실패</div>';
  }
}
