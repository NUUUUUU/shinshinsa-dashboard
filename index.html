<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신신사 일일 경영 브리핑</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink:  #E0144C;
  --lgray: #7F7F7F;
  --dgray: #404040;
  --sgray: #7C8FA3;
  --gold:  #B8A060;
  --black: #1E1E1E;
  --bg:    #F3F5F9;
  --card:  #FFFFFF;
  --hdr:   #FFFFFF;
  --txt:   #3A3A3A;
  --txt2:  #787878;
  --txt3:  #9DAABA;
  --bdr:   #E0E5EE;
  --bdr2:  #C8D2E0;
  --p-bg:  rgba(224,20,76,.08);  --p-bd: rgba(224,20,76,.28);
  --g-bg:  rgba(184,160,96,.10); --g-bd: rgba(184,160,96,.35);
  --s-bg:  rgba(124,143,163,.09);--s-bd: rgba(124,143,163,.32);
  --lge-bg:rgba(0,100,200,.07);  --lge-bd:rgba(0,100,200,.28);
  --pos:   #0A7C56;
  --neg:   var(--pink);
}
html,body{height:100vh;overflow:hidden;}
body{font-family:-apple-system,'Malgun Gothic','맑은 고딕',BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);font-size:18px;line-height:1.55;
  display:flex;flex-direction:column;}
/* HEADER */
.hdr{background:var(--hdr);border-bottom:2px solid var(--pink);padding:0 26px;height:60px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-left{display:flex;align-items:center;gap:16px;}
.hdr-title{font-size:28px;font-weight:800;color:var(--black);letter-spacing:-.3px;}
.hdr-date{font-size:18px;color:var(--txt2);padding-left:16px;border-left:1px solid var(--bdr2);}
.conf{font-size:13px;font-weight:700;padding:3px 12px;border-radius:3px;letter-spacing:.7px;
  background:var(--p-bg);color:var(--pink);border:1px solid var(--p-bd);}
.hdr-right{display:flex;align-items:center;gap:12px;}
/* Macro Scorecard Link Button */
.scorecard-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:6px;font-size:13px;font-weight:700;letter-spacing:.2px;
  background:linear-gradient(135deg,#0a3d62,#1a6fa8);color:#fff;
  border:none;cursor:pointer;text-decoration:none;transition:all .2s;
  box-shadow:0 2px 6px rgba(0,100,200,.25);}
.scorecard-btn:hover{background:linear-gradient(135deg,#0d4f7c,#2080c0);
  box-shadow:0 3px 10px rgba(0,100,200,.38);transform:translateY(-1px);}
.scorecard-btn svg{flex-shrink:0;}
/* 전체보고서·아카이브 버튼 */
.nav-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;
  border-radius:5px;font-size:12px;font-weight:600;letter-spacing:.1px;
  background:rgba(224,20,76,.12);color:var(--pink);text-decoration:none;
  border:1px solid rgba(224,20,76,.28);transition:all .2s;white-space:nowrap;}
.nav-btn:hover{background:rgba(224,20,76,.22);border-color:rgba(224,20,76,.5);transform:translateY(-1px);}
.nav-btn.arc{background:rgba(124,143,163,.1);color:var(--sgray);border-color:rgba(124,143,163,.3);}
.nav-btn.arc:hover{background:rgba(124,143,163,.2);}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:12px 26px;
  background:var(--hdr);border-bottom:1px solid var(--bdr);flex-shrink:0;}
.kpi{background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:12px 16px;}
.kpi.pos{border-left:4px solid var(--pos);}
.kpi.neg{border-left:4px solid var(--neg);}
.kpi.gld{border-left:4px solid var(--gold);}
.kpi.inf{border-left:4px solid var(--sgray);}
.kl{font-size:13px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.kv{font-size:38px;font-weight:700;color:var(--dgray);line-height:1.1;}
.kv sub{font-size:18px;font-weight:400;color:var(--txt2);vertical-align:baseline;}
.kc{font-size:17px;margin-top:3px;font-weight:600;}
.kc.pos{color:var(--pos);} .kc.neg{color:var(--neg);}
.ks{font-size:15px;color:var(--txt3);margin-top:2px;}
.ksum{font-size:16px;color:var(--black);font-weight:700;line-height:1.65;margin-top:5px;}
/* MAIN */
.main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:11px 26px 11px;
  flex:1;overflow:hidden;min-height:0;}
.sec{font-size:14px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sec::after{content:'';flex:1;height:1px;background:var(--bdr);}
.sec-dot{width:7px;height:7px;border-radius:50%;background:var(--pink);flex-shrink:0;}
/* NEWS */
.news-col{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.news-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);
  gap:8px;flex:1;overflow:hidden;min-height:0;}
.nc{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:11px 14px;
  display:flex;flex-direction:column;gap:5px;overflow:hidden;min-height:0;}
.nc.s3{border-left:4px solid var(--pink);}
.nc.s2{border-left:4px solid var(--gold);}
.nc.s1{border-left:4px solid var(--sgray);}
.nc-top{display:flex;align-items:flex-start;gap:9px;}
.bdg{flex-shrink:0;padding:3px 9px;border-radius:3px;font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;}
.s3 .bdg{background:var(--p-bg);color:var(--pink);border:1px solid var(--p-bd);}
.s2 .bdg{background:var(--g-bg);color:#7a6010;border:1px solid var(--g-bd);}
.s1 .bdg{background:var(--s-bg);color:#4a6278;border:1px solid var(--s-bd);}
.nt{font-size:20px;font-weight:700;color:var(--dgray);line-height:1.35;}
.nm-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0;}
.nm{font-size:14px;color:var(--txt3);}
.src-link{font-size:12px;color:var(--sgray);text-decoration:none;border:1px solid var(--bdr2);
  border-radius:3px;padding:1px 8px;white-space:nowrap;flex-shrink:0;background:var(--bg);
  transition:color .15s,border-color .15s;}
.src-link:hover{color:var(--pink);border-color:var(--p-bd);background:var(--p-bg);}
.nb{font-size:16px;color:var(--txt2);line-height:1.6;flex:1;}
.ni{font-size:15px;color:var(--txt2);background:rgba(184,160,96,.07);
  border-left:3px solid var(--gold);border-radius:0 4px 4px 0;
  padding:5px 11px;line-height:1.5;flex-shrink:0;}
.tags{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.tag{font-size:12px;padding:2px 9px;border-radius:3px;background:var(--bg);color:var(--txt3);border:1px solid var(--bdr);}
/* LG 필터 활성 시 뉴스란 헤더에 LG 홈 링크 표시 */
.lg-ref-link{font-size:12px;font-weight:700;color:#0064c8;text-decoration:none;
  padding:2px 8px;border-radius:3px;background:var(--lge-bg);border:1px solid var(--lge-bd);
  display:none;white-space:nowrap;}
.lg-ref-link:hover{background:#e8f0fd;}
.lg-active .lg-ref-link{display:inline-flex;align-items:center;gap:3px;}
/* RIGHT */
.right{display:flex;flex-direction:column;gap:7px;overflow:hidden;min-height:0;}
.right .sec{margin-bottom:6px;}
.ov-card{background:var(--card);border:1px solid var(--bdr);border-radius:7px;
  padding:8px 10px;display:grid;grid-template-columns:20px 1fr auto;
  gap:8px;align-items:start;margin-bottom:4px;}
.ov-card:last-child{margin-bottom:0;}
.of{font-size:16px;line-height:1.4;}
.on{font-size:13px;font-weight:700;color:var(--dgray);margin-bottom:2px;}
.oi{font-size:11px;font-weight:600;color:var(--acc);background:rgba(var(--acc-rgb,180,140,60),.08);
  border-radius:3px;padding:1px 5px;display:inline-block;margin-bottom:3px;letter-spacing:.01em;}
.ot{font-size:11.5px;color:var(--txt2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.os{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;margin-top:1px;}
.os.w{background:#fffbea;color:#7a6010;border:1px solid #e8d87a;}
.os.g{background:rgba(10,124,86,.09);color:#0A7C56;border:1px solid rgba(10,124,86,.28);}
.os.b{background:#fff0f0;color:#b03030;border:1px solid #f0b0b0;}
.os.r{background:#fff0f0;color:#b03030;border:1px solid #f0b0b0;}
.mkt-wrap{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:6px 11px;}
.mr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:14px;}
.mr:last-child{border-bottom:none;padding-bottom:0;}
.mv{font-size:16px;font-weight:700;}
.mv.pos{color:var(--pos);} .mv.neg{color:var(--neg);} .mv.gld{color:#7a6010;}
/* CHARTS */
.chart-area{flex:1;display:flex;flex-direction:column;min-height:120px;}
.chart-row{display:grid;grid-template-columns:1fr 1.4fr;gap:7px;flex:1;min-height:0;}
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:7px 10px;display:flex;flex-direction:column;}
.ct{font-size:13px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;flex-shrink:0;}
.cw{position:relative;flex:1;min-height:0;}
/* FX */
.fx-row{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--bdr);}
.fx-left{display:flex;align-items:center;gap:7px;}
.fx-flag{font-size:17px;line-height:1;}
.fx-name{font-size:14px;font-weight:700;color:var(--dgray);}
.fx-sub{font-size:12px;font-weight:400;color:var(--txt3);margin-left:2px;}
.fx-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.fx-val{font-size:17px;font-weight:700;color:var(--dgray);}
.fx-chg{font-size:12px;font-weight:700;}
.fx-chg.neg{color:var(--neg);} .fx-chg.pos{color:var(--pos);} .fx-chg.neu{color:var(--sgray);}
.fx-spark-wrap{position:relative;flex:1;max-width:88px;margin:0 5px;}
.fx-spark-wrap svg{display:block;overflow:visible;}
.fx-tooltip{position:fixed;background:#333;color:#fff;font-size:11px;
  font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;
  pointer-events:none;z-index:9999;}
/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0;}
.filter-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 13px;border-radius:20px;
  font-size:13px;font-weight:700;border:1px solid var(--bdr2);background:var(--card);
  color:var(--txt2);cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.4;}
.filter-btn:hover{border-color:var(--pink);color:var(--pink);background:var(--p-bg);}
.filter-btn.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.filter-btn[data-filter="lg"].active{background:#0064c8;border-color:#0064c8;}
.filter-btn[data-filter="lg"]:not(.active):hover{color:#0064c8;border-color:var(--lge-bd);background:var(--lge-bg);}
.filter-btn.empty{opacity:.38;pointer-events:none;}
.fbadge{font-size:11px;background:rgba(255,255,255,.25);padding:0 5px;border-radius:8px;line-height:1.5;}
.filter-btn:not(.active) .fbadge{background:var(--bg);color:var(--txt3);}
.filter-sep{width:1px;height:18px;background:var(--bdr2);flex-shrink:0;margin:0 2px;}
.news-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
  color:var(--txt3);font-size:15px;padding:30px;gap:8px;}
/* FOOTER */
footer{background:var(--hdr);border-top:1px solid var(--bdr);padding:0 26px;height:36px;
  display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--txt3);flex-shrink:0;}
footer strong{color:var(--pink);font-weight:700;}
</style>
</head>

<script>
/* Macro Scorecard: https://NUUUUUU.github.io/weekly-briefing/ (직접 링크 — JS 불필요) */

/* ══════════════════════════════════════
   뉴스 필터 — 6개 카테고리
   전체 / LG / 한국 / 중국 / 태국 / 이집트
   ══════════════════════════════════════ */
let _allNews = [];
let _currentFilter = 'all';

const FILTER_KEYS = ['all','lg','한국','중국','태국','이집트'];

function classifyNewsItem(item) {
  const tags  = (item.tags  || []).map(t => t.toLowerCase());
  const title = (item.title || '').toLowerCase();
  const src   = (item.source|| '').toLowerCase();
  const body  = (item.body  || '').toLowerCase();
  const cats  = new Set(['all']);

  /* 국가 판별 (source 우선, 그 다음 tags) */
  const isThai  = /thailand|bangkok|nation thai|thaipbs|post today/.test(src) || tags.includes('태국');
  const isChina = /\bnbs\b|caixin|xinhua|global times|globaltimes|peoples.daily|china|scmp/.test(src) || tags.includes('중국');
  const isEgypt = /egypt|ahram|cairo|daily news egypt|egypt today|egypt independent/.test(src) || tags.includes('이집트');
  const isKorea = !isThai && !isChina && !isEgypt;

  if (isThai)  cats.add('태국');
  if (isChina) cats.add('중국');
  if (isEgypt) cats.add('이집트');

  /* LG 판별: tags·title·source 모두 확인 */
  const isLG = tags.some(t => t.includes('lg전자') || t === 'lg')
            || title.includes('lg전자') || title.includes('lg ')
            || src.includes('lg전자');

  if (isLG) {
    cats.add('lg');
  }

  /* 한국: 한국 출처 기사 (LG 포함, 국가 관련 산업·경제 전반) */
  if (isKorea) {
    cats.add('한국');
  }

  return [...cats];
}

function updateBadges(news) {
  FILTER_KEYS.forEach(f => {
    const count = f === 'all'
      ? news.length                                                    // 전체 수집 건수
      : news.filter(n => classifyNewsItem(n).includes(f)).length;     // 카테고리 건수
    const el = document.getElementById('fb-' + f);
    if (el) el.textContent = f === 'all' ? `${Math.min(8, news.length)}/${news.length}` : count;
    const btn = document.querySelector(`.filter-btn[data-filter="${f}"]`);
    if (btn) btn.classList.toggle('empty', count === 0 && f !== 'all');
  });
}

function setLGHeaderLinks(active) {
  const secEl = document.getElementById('news-sec');
  if (active) {
    secEl.classList.add('lg-active');
  } else {
    secEl.classList.remove('lg-active');
  }
}

function applyFilter(filter) {
  _currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === filter));
  setLGHeaderLinks(filter === 'lg');

  let filtered;
  if (filter === 'all') {
    // 전체: 전체 뉴스를 중요도 내림차순 정렬 → 상위 8건만 표시
    filtered = [..._allNews]
      .sort((a, b) => (b.importance||0) - (a.importance||0))
      .slice(0, 8);
  } else {
    // 카테고리: 해당 카테고리 기사를 중요도 내림차순 정렬 → 최대 8건
    filtered = _allNews
      .filter(n => classifyNewsItem(n).includes(filter))
      .sort((a, b) => (b.importance||0) - (a.importance||0))
      .slice(0, 8);
  }
  renderGrid(filtered);
}

function renderGrid(items) {
  const stars = {3:'★★★', 2:'★★', 1:'★'};
  const cls   = {3:'s3',   2:'s2',  1:'s1'};
  const grid  = document.getElementById('news-grid');
  const count = Math.min(items.length, 8);
  const rows  = count === 0 ? 1 : Math.max(1, Math.ceil(count / 2));
  grid.style.gridTemplateRows = `repeat(${rows},1fr)`;

  const s3 = items.filter(n=>n.importance===3).length;
  const s2 = items.filter(n=>n.importance===2).length;
  const s1 = items.filter(n=>n.importance===1).length;

  // 섹션 헤더 뱃지 텍스트 업데이트 (LG 링크 유지)
  const secNode = document.getElementById('news-sec');
  const lgRef   = document.getElementById('lg-ref-link');
  const lgIR    = document.getElementById('lg-ir-link');
  secNode.childNodes[0].textContent = '';
  // span.sec-dot 유지 후 텍스트 노드 교체
  const dots = secNode.querySelector('.sec-dot');
  secNode.innerHTML = '';
  if (dots) secNode.appendChild(dots);
  // 전체 vs 카테고리 헤더 텍스트 구분
  const totalAll = _allNews.length;
  const headerTxt = _currentFilter === 'all'
    ? ` 주요 뉴스 · 중요도 상위 ${count}건 선정 (전체 ${totalAll}건 수집)`
    : ` 주요 뉴스 · ${count}건 (★★★ ${s3} / ★★ ${s2} / ★ ${s1})`;
  const textNode = document.createTextNode(headerTxt);
  secNode.appendChild(textNode);
  // LG 링크 재삽입
  const a1 = document.createElement('a');
  a1.id='lg-ref-link'; a1.className='lg-ref-link';
  a1.href='https://live.lge.co.kr/';
  a1.target='_blank'; a1.rel='noopener'; a1.textContent='🔵 LG 뉴스룸 ↗';
  const a2 = document.createElement('a');
  a2.id='lg-ir-link'; a2.className='lg-ref-link';
  a2.href='https://www.lge.co.kr/company/investor/IREvents';
  a2.target='_blank'; a2.rel='noopener'; a2.textContent='📋 IR ↗';
  a2.style.marginLeft='-4px';
  secNode.appendChild(a1); secNode.appendChild(a2);
  if (_currentFilter === 'lg') secNode.classList.add('lg-active');
  else secNode.classList.remove('lg-active');

  if (count === 0) {
    grid.innerHTML = `<div class="news-empty">📭 해당 필터의 뉴스가 없습니다.</div>`;
    return;
  }
  grid.innerHTML = items.slice(0,8).map(item => `
    <div class="nc ${cls[item.importance]||'s1'}">
      <div class="nc-top">
        <span class="bdg">${stars[item.importance]||'★'}</span>
        <div class="nt">${item.title}</div>
      </div>
      <div class="nm-row">
        <span class="nm">${item.source} · ${item.pubDate}</span>
        ${item.url ? `<a class="src-link" href="${item.url}" target="_blank" rel="noopener">원문 ↗</a>` : ''}
      </div>
      <div class="nb">${item.body||''}</div>
      ${item.impact ? `<div class="ni">${item.impact}</div>` : ''}
      <div class="tags">${(item.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>`).join('');
}

/* ══════════════════════════════════════
   SVG 차트 헬퍼
   ══════════════════════════════════════ */
function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

function drawLine(svgId, data, labels, color, minV, maxV, yFmt) {
  const svg = document.getElementById(svgId);
  if (!svg || data.length < 2) return;
  const W = svg.clientWidth  || 220;
  const H = svg.clientHeight || 90;
  const ml=46, mr=8, mt=10, mb=26;
  const pw=W-ml-mr, ph=H-mt-mb, n=data.length;
  const xs = i => ml + (i/(n-1))*pw;
  const ys = v => mt + ph - ((v-minV)/(maxV-minV))*ph;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  // 그리드 라인 & Y 라벨
  [0, 0.5, 1].forEach(t => {
    const v = minV + t*(maxV-minV), y = ys(v);
    svg.appendChild(svgEl('line',{x1:ml,y1:y,x2:W-mr,y2:y,
      stroke:'rgba(0,0,0,0.06)','stroke-width':1}));
    const tx = svgEl('text',{x:ml-5,y:y+5,'text-anchor':'end',
      'font-size':11,fill:'#9DAABA','font-family':'sans-serif'});
    tx.textContent = yFmt ? yFmt(v) : v.toFixed(0);
    svg.appendChild(tx);
  });

  // 면적 채우기
  const pts = `${xs(0)},${mt+ph} ` +
    data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ') +
    ` ${xs(n-1)},${mt+ph}`;
  svg.appendChild(svgEl('polygon',{points:pts, fill:color, opacity:'0.12'}));

  // 라인
  svg.appendChild(svgEl('polyline',{
    points:data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' '),
    fill:'none', stroke:color, 'stroke-width':2.5,
    'stroke-linejoin':'round', 'stroke-linecap':'round'
  }));

  // 데이터 포인트
  data.forEach((v,i) => {
    svg.appendChild(svgEl('circle',{cx:xs(i),cy:ys(v),r:3.5,fill:color}));
  });

  // X 라벨 (짝수 인덱스만)
  (labels||[]).forEach((l,i) => {
    if (n > 5 && i%2 !== 0 && i !== n-1) return;
    const tx = svgEl('text',{x:xs(i),y:H-4,'text-anchor':'middle',
      'font-size':10,fill:'#9DAABA','font-family':'sans-serif'});
    tx.textContent = l;
    svg.appendChild(tx);
  });
}

/* ══════════════════════════════════════
   렌더러
   ══════════════════════════════════════ */
function renderKPI(kpis) {
  document.getElementById('kpi-row').innerHTML = (kpis||[]).map(k => {
    if (k.type === 'inf') return `
      <div class="kpi inf">
        <div class="kl">${k.label}</div>
        <div class="ksum">${k.summary||''}</div>
      </div>`;
    const chgClass = k.type==='pos'?'pos':k.type==='neg'?'neg':'';
    return `
      <div class="kpi ${k.type||'gld'}">
        <div class="kl">${k.label}</div>
        <div class="kv">${k.value||'—'}${k.unit?`<sub>${k.unit}</sub>`:''}</div>
        <div class="kc ${chgClass}">${k.change||''}</div>
        <div class="ks">${k.note||''}</div>
      </div>`;
  }).join('');
}

function renderOverseas(items) {
  const sm = {u:'g', w:'w', d:'b', g:'g', r:'r', '양호':'g', '주시':'w', '경고':'r', '위험':'r', '주의':'w'};
  document.getElementById('overseas-cards').innerHTML = (items||[]).map(o => {
    const indHtml = o.indicators ? `<div class="oi">${o.indicators}</div>` : '';
    const cls = sm[o.statusType] || sm[o.status] || 'w';
    return `
    <div class="ov-card">
      <span class="of">${o.flag||''}</span>
      <div>
        <div class="on">${o.country}</div>
        ${indHtml}
        <div class="ot">${o.summary||''}</div>
      </div>
      <span class="os ${cls}">${o.status||''}</span>
    </div>`;
  }).join('');
}

function renderMarkets(items) {
  document.getElementById('market-rows').innerHTML = (items||[]).map(m => `
    <div class="mr">
      <span style="color:var(--txt2);font-size:14px;">${m.label}</span>
      <span class="mv ${m.color||'gld'}">${m.value}</span>
    </div>`).join('');
}

function renderFX(fxList) {
  const card = document.getElementById('fx-card');
  card.innerHTML = '<div class="ct">환율 (vs USD) · 영업일 7일 추이</div>' +
    (fxList||[]).map((f,i)=>`
    <div class="fx-row">
      <div class="fx-left">
        <span class="fx-flag">${f.flag||''}</span>
        <div>
          <span class="fx-name">${f.currency}</span>
          <span class="fx-sub">${f.country}</span>
        </div>
      </div>
      <div class="fx-spark-wrap">
        <svg id="fxsp-${i}" width="100%" height="32" style="overflow:visible;"></svg>
        <div id="fxtt-${i}" class="fx-tooltip" style="display:none;"></div>
      </div>
      <div class="fx-right">
        <span class="fx-val">${f.rate_usd||f.value||'—'}</span>
        <span class="fx-chg ${f.color||f.dir||'neu'}">${f.change||'—'}</span>
      </div>
    </div>`).join('');

  // 스파크라인 그리기
  setTimeout(() => {
    (fxList||[]).forEach((f,i) => {
      const h = f.history;
      if (!h || !h.values || h.values.length < 2) return;
      drawFXSpark(`fxsp-${i}`, `fxtt-${i}`, h.values, h.labels||[], f.color||f.dir||'neu');
    });
  }, 60);
}

function drawFXSpark(svgId, ttId, data, labels, colorClass) {
  const svg = document.getElementById(svgId);
  const tt  = document.getElementById(ttId);
  if (!svg || !tt || data.length < 2) return;
  const W = svg.clientWidth || 80;
  const H = 32;
  const ml=2, mr=2, mt=5, mb=5;
  const pw=W-ml-mr, ph=H-mt-mb, n=data.length;
  const minV = Math.min(...data);
  const maxV = Math.max(...data);
  const range = maxV - minV || 0.01;
  const xs = idx => ml + (idx/(n-1))*pw;
  const ys = v  => mt + ph - ((v-minV)/range)*ph;
  const clr = colorClass==='neg'?'#E0144C':colorClass==='pos'?'#0A7C56':'#7C8FA3';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML = '';

  // polygon area fill
  const apts = `${xs(0)},${mt+ph} `+
    data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ')+
    ` ${xs(n-1)},${mt+ph}`;
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points',apts); poly.setAttribute('fill',clr); poly.setAttribute('opacity','0.13');
  svg.appendChild(poly);

  // line
  const line = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  line.setAttribute('points',data.map((v,i)=>`${xs(i)},${ys(v)}`).join(' '));
  line.setAttribute('fill','none'); line.setAttribute('stroke',clr);
  line.setAttribute('stroke-width','1.8');
  line.setAttribute('stroke-linejoin','round');
  line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  // data point circles
  data.forEach((v,i) => {
    const cx = xs(i), cy = ys(v);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy);
    c.setAttribute('r', i===n-1 ? '3.5' : '2.2');
    c.setAttribute('fill',clr);
    if (i===n-1){ c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1'); }
    svg.appendChild(c);
  });

  // invisible overlay rect — catches ALL mouse events on entire SVG
  const overlay = document.createElementNS('http://www.w3.org/2000/svg','rect');
  overlay.setAttribute('x',0); overlay.setAttribute('y',0);
  overlay.setAttribute('width',W); overlay.setAttribute('height',H);
  overlay.setAttribute('fill','rgba(0,0,0,0)');
  overlay.setAttribute('pointer-events','all');
  svg.appendChild(overlay);

  // 단일 mousemove — X 위치로 가장 가까운 데이터 포인트 찾기
  svg.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    // scale mouseX to SVG coords
    const scaleX = W / (rect.width || W);
    const svgX = mouseX * scaleX;
    // 가장 가까운 인덱스
    let best = 0, bestD = Infinity;
    for (let i=0; i<n; i++) {
      const d = Math.abs(xs(i) - svgX);
      if (d < bestD) { bestD = d; best = i; }
    }
    const v = data[best];
    const numV = parseFloat(v);
    const displayV = isNaN(numV)?v:(numV>=100?numV.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}):numV.toFixed(2));
    const displayLbl = labels[best]||String(best+1);
    tt.textContent = displayLbl + ': ' + displayV;
    tt.style.display = 'block';
    // fixed 위치: 마우스 바로 위
    tt.style.left = e.clientX + 'px';
    tt.style.top  = (e.clientY - 32) + 'px';
  });

  svg.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
}

/* ══════════════════════════════════════
   데이터 로드
   ══════════════════════════════════════ */
async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();

    document.getElementById('hdr-date').textContent  = d.date_kr || d.date || '—';
    document.getElementById('footer-ts').textContent = '발행: ' + (d.generated_at||'—');

    renderKPI(d.kpis||[]);

    _allNews = d.news||[];
    updateBadges(_allNews);
    applyFilter(_currentFilter);

    renderOverseas(d.overseas||[]);
    renderMarkets(d.markets||[]);
    renderFX(d.fx||[]);

    if (d.wti && (d.wti.values||[]).length > 1) {
      const w = d.wti;
      document.getElementById('wti-title').textContent =
        `WTI 유가 (${w.values.length}거래일, USD/bbl)  ${w.trend||''}`;
      setTimeout(() => drawLine('wti-chart', w.values, w.labels||[],
        '#E0144C', w.min||60, w.max||100, v=>v.toFixed(0)), 80);
    }
  } catch(e) {
    console.error('data.json 로드 실패:', e);
    document.getElementById('hdr-date').textContent = '데이터 로드 실패';
  }
}

/* ══════════════════════════════════════
   초기화
   ══════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.filter-btn').forEach(btn =>
    btn.addEventListener('click', () => applyFilter(btn.dataset.filter)));
  loadData();
});
