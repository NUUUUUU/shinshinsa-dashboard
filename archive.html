<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>신신사 브리핑 아카이브</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#C8102E; --red-lt:#FBEAF0; --red-bd:rgba(200,16,46,.22);
  --gold:#9A7D30; --gold-lt:#FAEEDA;
  --blue:#185FA5; --blue-lt:#E6F1FB; --blue-bd:rgba(55,138,221,.3);
  --green:#3B6D11; --green-lt:#EAF3DE;
  --gray:#888780; --gray-lt:#F1EFE8;
  --card:#ffffff; --bg:#F4F5F8; --txt:#1A1A2E; --txt2:#6B7480; --txt3:#9AA3AE;
  --bdr:rgba(0,0,0,.09);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --card:#1E1E2A; --bg:#12121C; --txt:#E8E8F0; --txt2:#9AA3AE; --txt3:#5C6370;
    --bdr:rgba(255,255,255,.09);
    --red-lt:rgba(200,16,46,.15); --gold-lt:rgba(186,117,23,.15);
    --blue-lt:rgba(55,138,221,.15); --green-lt:rgba(99,153,34,.15); --gray-lt:rgba(136,135,128,.12);
  }
}
html{font-size:16px;}
body{font-family:-apple-system,'Malgun Gothic','맑은 고딕',BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.6;
  padding-bottom:calc(20px + var(--safe-bottom));}

.top-bar{background:var(--red);padding:calc(8px + var(--safe-top)) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.bar-left{display:flex;align-items:center;gap:10px;}
.bar-title{color:#fff;font-size:15px;font-weight:500;}
.bar-sub{color:rgba(255,255,255,.7);font-size:12px;}
.bar-right{display:flex;align-items:center;gap:8px;}
.back-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;
  border-radius:5px;font-size:11px;font-weight:500;background:rgba(255,255,255,.15);
  color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);}
.conf{font-size:10px;font-weight:500;padding:3px 8px;border-radius:3px;
  background:rgba(255,255,255,.2);color:#fff;letter-spacing:.5px;}

.wrap{max-width:540px;margin:0 auto;padding:12px 12px 0;}

.section-head{font-size:12px;font-weight:500;color:var(--txt3);text-transform:uppercase;
  letter-spacing:.8px;padding:4px 0 8px;display:flex;align-items:center;gap:6px;}
.sec-dot{width:5px;height:5px;border-radius:50%;background:var(--red);}

.month-group{margin-bottom:16px;}
.month-label{font-size:13px;font-weight:500;color:var(--txt2);padding:6px 0 6px;
  border-bottom:1px solid var(--bdr);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.month-count{font-size:11px;font-weight:400;color:var(--txt3);
  background:var(--gray-lt);padding:1px 7px;border-radius:8px;margin-left:auto;}

.day-item{background:var(--card);border-radius:12px;border:1px solid var(--bdr);
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;
  justify-content:space-between;text-decoration:none;color:inherit;
  transition:background .15s,border-color .15s;cursor:pointer;}
.day-item:hover{border-color:rgba(200,16,46,.3);background:var(--red-lt);}
.day-left{display:flex;align-items:center;gap:12px;}
.day-num{font-size:28px;font-weight:300;color:var(--red);line-height:1;min-width:36px;text-align:center;}
.day-info{}
.day-date{font-size:14px;font-weight:500;color:var(--txt);}
.day-dow{font-size:12px;color:var(--txt3);margin-top:1px;}
.day-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:12px;
  background:var(--green-lt);color:var(--green);}
.day-badge.today{background:var(--red-lt);color:var(--red);}
.day-badge.old{background:var(--gray-lt);color:var(--gray);}

.empty-state{text-align:center;padding:40px 20px;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-txt{font-size:14px;color:var(--txt2);}
.empty-sub{font-size:12px;color:var(--txt3);margin-top:4px;}

.skeleton{background:var(--gray-lt);border-radius:6px;height:14px;margin:4px 0;
  animation:pulse 1.4s ease-in-out infinite;}
.skel-card{background:var(--card);border-radius:12px;border:1px solid var(--bdr);
  padding:12px 14px;margin-bottom:8px;height:62px;
  animation:pulse 1.4s ease-in-out infinite;background:var(--gray-lt);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--card);border-radius:10px;border:1px solid var(--bdr);
  padding:10px 12px;text-align:center;}
.stat-val{font-size:24px;font-weight:300;color:var(--red);line-height:1;}
.stat-lbl{font-size:11px;color:var(--txt3);margin-top:3px;}

.footer{text-align:center;font-size:11px;color:var(--txt3);padding:20px 12px 0;line-height:1.7;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="bar-left">
    <span class="bar-title">브리핑 아카이브</span>
    <span class="bar-sub" id="bar-sub">—</span>
  </div>
  <div class="bar-right">
    <a class="back-btn" href="briefing.html">최신 ↗</a>
    <span class="conf">CONFIDENTIAL</span>
  </div>
</div>

<div class="wrap">

  <!-- 통계 요약 -->
  <div class="stats-row" id="stats-row">
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
  </div>

  <!-- 월별 그룹 목록 -->
  <div class="section-head"><span class="sec-dot"></span>날짜별 브리핑 목록</div>
  <div id="list-container">
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
  </div>

</div>

<div class="footer">
  기획팀 내부 자료 &nbsp;|&nbsp; CONFIDENTIAL<br>
  신신사(ShinShinsa) AI 일일 경영 브리핑 아카이브
</div>

<script>
const DAYS_KR=['일','월','화','수','목','금','토'];
const MONTHS_KR=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function parseDate(yyyymmdd){
  const s=String(yyyymmdd);
  if(s.length!==8)return null;
  return new Date(s.slice(0,4),parseInt(s.slice(4,6))-1,parseInt(s.slice(6,8)));
}

function fmtFull(yyyymmdd){
  const d=parseDate(yyyymmdd);
  if(!d)return yyyymmdd;
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function fmtDow(yyyymmdd){
  const d=parseDate(yyyymmdd);
  if(!d)return '';
  return DAYS_KR[d.getDay()]+'요일';
}

function getDayNum(yyyymmdd){
  return parseInt(yyyymmdd.slice(6,8));
}

function getMonthKey(yyyymmdd){
  return yyyymmdd.slice(0,6); // YYYYMM
}

function fmtMonthLabel(yyyymm){
  const y=yyyymm.slice(0,4),m=parseInt(yyyymm.slice(4,6));
  return `${y}년 ${m}월`;
}

function isToday(yyyymmdd){
  const now=new Date();
  const td=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  return yyyymmdd===td;
}

function isRecent(yyyymmdd){
  const d=parseDate(yyyymmdd);
  if(!d)return false;
  const diffMs=Date.now()-d.getTime();
  return diffMs<7*24*60*60*1000; // 7일 이내
}

function getBadge(yyyymmdd){
  if(isToday(yyyymmdd))return `<span class="day-badge today">오늘</span>`;
  if(isRecent(yyyymmdd))return `<span class="day-badge">최근</span>`;
  return `<span class="day-badge old">과거</span>`;
}

function renderList(dates){
  // 날짜 내림차순 (최신→과거)
  const sorted=[...dates].sort((a,b)=>b.localeCompare(a));

  if(!sorted.length){
    document.getElementById('list-container').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-txt">아직 저장된 브리핑이 없습니다</div>
        <div class="empty-sub">첫 번째 브리핑이 생성되면 여기에 표시됩니다</div>
      </div>`;
    return;
  }

  // 월별 그룹핑
  const groups={};
  sorted.forEach(d=>{
    const mk=getMonthKey(d);
    if(!groups[mk])groups[mk]=[];
    groups[mk].push(d);
  });

  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(mk=>{
    const days=groups[mk];
    html+=`<div class="month-group">
      <div class="month-label">📅 ${fmtMonthLabel(mk)} <span class="month-count">${days.length}건</span></div>`;
    days.forEach(d=>{
      html+=`<a class="day-item" href="briefing.html?date=${d}">
        <div class="day-left">
          <div class="day-num">${getDayNum(d)}</div>
          <div class="day-info">
            <div class="day-date">${fmtFull(d)}</div>
            <div class="day-dow">${fmtDow(d)}</div>
          </div>
        </div>
        ${getBadge(d)}
      </a>`;
    });
    html+='</div>';
  });

  document.getElementById('list-container').innerHTML=html;
}

function renderStats(dates){
  const now=new Date();
  const thisMonth=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthCount=dates.filter(d=>d.startsWith(thisMonth)).length;
  const total=dates.length;
  // 연속 일수 계산
  let streak=0;
  const sorted=[...dates].sort((a,b)=>b.localeCompare(a));
  for(let i=0;i<sorted.length;i++){
    const d=parseDate(sorted[i]);
    const expected=new Date(Date.now()-i*86400000);
    const expStr=`${expected.getFullYear()}${String(expected.getMonth()+1).padStart(2,'0')}${String(expected.getDate()).padStart(2,'0')}`;
    if(sorted[i]===expStr)streak++;
    else break;
  }

  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">누적 건수</div></div>
    <div class="stat-card"><div class="stat-val">${monthCount}</div><div class="stat-lbl">이번 달</div></div>
    <div class="stat-card"><div class="stat-val">${streak}</div><div class="stat-lbl">연속 발행</div></div>`;
}

async function load(){
  try{
    const r=await fetch('manifest.json?t='+Date.now());
    const m=await r.json();
    const dates=m.dates||[];
    document.getElementById('bar-sub').textContent=`총 ${dates.length}건`;
    renderStats(dates);
    renderList(dates);
  }catch(e){
    console.error('manifest.json 로드 실패:',e);
    document.getElementById('list-container').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-txt">목록을 불러올 수 없습니다</div>
        <div class="empty-sub">manifest.json이 아직 생성되지 않았거나 연결에 실패했습니다</div>
      </div>`;
    document.getElementById('stats-row').innerHTML='';
  }
}

load();
</script>
</body>
</html>
