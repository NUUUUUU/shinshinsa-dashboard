<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#E5003E">
<title>한국어 번역 — 신신사 브리핑</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="briefing/tokens.css?v=20260904a">
<script>
/* 보고서와 같은 다크 설정을 그대로 따른다 — 링크로 넘어왔을 때 화면이 안 튀게 */
(function(){
  var saved = localStorage.getItem('theme');
  if(saved){ document.documentElement.dataset.theme = saved; }
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches){
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js" defer></script>
<script src="briefing/annotate.js?v=20260904a"></script>
<style>
  /* 색은 briefing/tokens.css 에서 온다. 여기서 다시 정의하지 않는다.
     예전엔 --red:#E0004D 같은 자체 팔레트를 써서 보고서와 색이 어긋났고
     다크모드도 없었다(2026-09-03 정리). */
  :root{ --line:var(--bdr); --txt2:var(--txt-body); --txt3:var(--txt-lbl);
         --blue:var(--info); --gold:var(--warn); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);line-height:1.75;-webkit-text-size-adjust:100%;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px;}
  .top{display:flex;align-items:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--txt-body);
    text-decoration:none;font-weight:500;min-height:34px;
    border:1px solid var(--bdr);border-radius:6px;padding:6px 11px;background:var(--fill);
    white-space:nowrap;transition:background .18s ease;}
  .back:hover{background:var(--card);}
  .back svg{width:12px;height:12px;stroke-width:2.2;}
  .brand{font-size:11.5px;color:var(--txt-lbl);font-weight:700;letter-spacing:.09em;}
  .logo{height:22px;width:auto;margin-left:auto;display:block;}
  .logo-wrap{margin-left:auto;padding:3px 6px;border-radius:4px;}
  [data-theme="dark"] .logo-wrap{background:#fff;}
  .card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:22px;
    box-shadow:none;}
  /* 라벨은 보고서의 kicker 와 같은 규칙 — 브랜드색 글씨 + 오른쪽 hairline */
  .badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;
    letter-spacing:.09em;color:var(--accent);background:transparent;padding:0;margin-bottom:10px;}
  .cat{display:inline-block;font-size:10.5px;font-weight:600;color:var(--txt-sub);
    background:var(--fill);border:1px solid var(--bdr);border-radius:4px;
    padding:2px 7px;margin-left:8px;}
  h1{font-size:23px;line-height:1.38;margin:2px 0 10px;font-weight:700;letter-spacing:-.02em;}
  .meta{font-size:12px;color:var(--txt-lbl);margin-bottom:8px;font-variant-numeric:tabular-nums;}
  .orig{font-size:12.5px;color:var(--txt-sub);background:var(--fill);
    border-left:2px solid var(--bdr);
    padding:9px 12px;border-radius:0 6px 6px 0;margin:12px 0 18px;word-break:break-word;}
  .sec-title{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--accent);
    margin:26px 0 10px;border-bottom:1px solid var(--bdr);padding-bottom:7px;}
  .body{font-size:15.5px;color:var(--txt-body);white-space:pre-wrap;line-height:1.8;}
  .toggle{margin:24px 0 0;}
  .toggle button{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--txt-body);
    background:var(--fill);border:1px solid var(--bdr);border-radius:8px;
    padding:13px;min-height:44px;cursor:pointer;touch-action:manipulation;
    transition:background .18s ease;}
  .toggle button:hover{background:var(--card);}
  .toggle button svg{width:14px;height:14px;stroke-width:2;transition:transform .2s ease;}
  .toggle button.open svg{transform:rotate(180deg);}
  .full{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--bdr);}
  .full.open{display:block;}
  .links{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;}
  .links a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;
    text-decoration:none;border-radius:6px;padding:9px 14px;min-height:38px;
    border:1px solid var(--bdr);color:var(--txt-body);background:var(--fill);
    touch-action:manipulation;transition:background .18s ease;}
  .links a:hover{background:var(--card);}
  .links a svg{width:12px;height:12px;stroke-width:2.2;}
  .a-orig{color:var(--txt-body);}
  .foot{font-size:11px;color:var(--txt-lbl);text-align:center;margin-top:28px;line-height:1.7;}
  .err{padding:48px 16px;text-align:center;color:var(--txt-lbl);font-size:14px;}
  @media (max-width:640px){
    .wrap{padding:16px 13px 56px;}
    .card{padding:16px 15px;}
    h1{font-size:20px;}
    .body{font-size:15px;}
  }
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" id="back-link" href="briefing.html"><i data-lucide="arrow-left"></i><span id="back-txt">보고서로</span></a>
      <span class="brand">한국어 번역</span>
      <span class="logo-wrap"><img class="logo" src="assets/logo-lockup.png"
        alt="(주)신신사" width="550" height="83" decoding="async"></span>
    </div>
    <div id="gl-pop" role="tooltip" aria-hidden="true"></div>
    <div id="root"><div class="err">불러오는 중…</div></div>
    <div class="foot">원문 저작권은 각 매체에 있으며, 본 번역은 내부 참고용 자동 번역입니다.<br>AI 자동 번역 / 검수: 이승환 선임</div>
  </div>

<script>
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qp(k){return new URLSearchParams(location.search).get(k);}
// 한국어 본문을 문장 단위 단락으로 분리해 가독성 향상
function paras(text){
  if(!text) return '';
  let t = esc(text);
  // '[신신사 시사점]'은 항상 새 단락으로
  t = t.replace(/\s*(\[[^\]]*시사점[^\]]*\])/g, '\n\n$1');
  // 한국어 문장 종결(다/요/음/함/됨/까/네 + 마침표·물음표·느낌표 + 공백) 뒤 단락 구분
  //  숫자의 소수점(예: 182.81, 48.6%)은 앞 글자가 한글이 아니므로 영향 없음
  t = t.replace(/([다요음함됨까네])([.!?])\s+/g, '$1$2\n\n');
  return t.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean)
          .map(s=>`<p style="margin:0 0 11px;">${s}</p>`).join('');
}

async function load(){
  const id = qp('id');
  const root = document.getElementById('root');
  if(!id){ root.innerHTML='<div class="err">기사 ID가 없습니다.</div>'; return; }
  let data;
  try{
    const r = await fetch('translations.json?_='+Date.now());
    data = await r.json();
  }catch(e){
    root.innerHTML='<div class="err">번역 데이터를 불러오지 못했습니다.</div>'; return;
  }
  const it = (data.items||{})[id];
  if(!it){ root.innerHTML='<div class="err">해당 기사의 번역을 찾을 수 없습니다. (id: '+esc(id)+')</div>'; return; }

  root.innerHTML = `
    <div class="card">
      <span class="badge">한국어 번역</span>${it.category?`<span class="cat">${esc(it.category)}</span>`:''}
      <h1>${esc(it.title_ko||'')}</h1>
      <div class="meta">${esc(it.source||'')} · ${esc(it.pubDate||'')}</div>
      ${it.title_orig?`<div class="orig">원제: ${esc(it.title_orig)}</div>`:''}
      ${it.image?`<img src="${esc(it.image)}" alt="${esc(it.title_ko||'')}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'" style="width:100%;max-height:420px;object-fit:cover;border-radius:8px;margin:8px 0 16px;display:block;border:1px solid var(--bdr);">`:''}

      <div class="sec-title">핵심 요약</div>
      <div class="body">${paras(it.summary_ko)}</div>

      ${it.full_ko?`
      <div class="toggle"><button id="tg"><span id="tg-txt">전문 번역 보기</span><i data-lucide="chevron-down"></i></button></div>
      <div class="full" id="full">
        <div class="sec-title">전문 번역</div>
        <div class="body">${paras(it.full_ko)}</div>
      </div>`:''}

      <div class="links">
        ${it.url?`<a class="a-orig" href="${esc(it.url)}" target="_blank" rel="noopener">원문 보기<i data-lucide="external-link"></i></a>`:''}
      </div>
    </div>`;

  const tg = document.getElementById('tg');
  if(tg){
    tg.addEventListener('click', ()=>{
      const f = document.getElementById('full');
      const open = f.classList.toggle('open');
      tg.classList.toggle('open', open);
      document.getElementById('tg-txt').textContent = open ? '전문 번역 접기' : '전문 번역 보기';
    });
  }
  document.title = (it.title_ko||'한국어 번역') + ' — 신신사 브리핑';

  /* 번역 본문은 원문 기사라 전문 용어가 오히려 더 많다.
     용어집은 그날 보고서의 data.json 에서 가져온다(없으면 조용히 넘어간다). */
  if(window.Annotate){
    try{
      const gr = await fetch('data.json?_='+Date.now());
      if(gr.ok){
        const gd = await gr.json();
        Annotate.setGlossary(gd.glossary||[]);
      }
    }catch(e){ /* 용어집이 없어도 본문은 그대로 보여야 한다 */ }
    document.querySelectorAll('.body').forEach(el=>Annotate.run([el],{cap:3}));
    Annotate.run(['root'], {termsOnly:true});
  }
}
(function(){
  var fromPage = qp('from') || 'briefing.html';
  var b = document.getElementById('back-link');
  if(b){
    b.href = fromPage;
    var t = document.getElementById('back-txt');
    if(t) t.textContent = fromPage.indexOf('index')>=0 ? '대시보드로' : '보고서로';
  }
})();
load().then(function(){ if(window.lucide) lucide.createIcons(); });
document.addEventListener('DOMContentLoaded',function(){ if(window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
