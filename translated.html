<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 번역 — 신신사 브리핑</title>
<style>
  :root{
    --red:#E0004D; --gold:#b8860b; --txt:#1a1a1a; --txt2:#444; --txt3:#888;
    --bg:#f5f5f7; --card:#fff; --line:#e3e3e8; --blue:#1a5fb4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);
    color:var(--txt);line-height:1.65;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;}
  .top{display:flex;align-items:center;gap:10px;margin:6px 0 16px;}
  .back{font-size:13px;color:var(--blue);text-decoration:none;font-weight:600;
    border:1px solid var(--line);border-radius:18px;padding:5px 12px;background:var(--card);white-space:nowrap;}
  .brand{font-size:12px;color:var(--txt3);font-weight:700;letter-spacing:.5px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--red);
    border-radius:5px;padding:2px 8px;margin-bottom:10px;}
  .cat{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);
    border:1px solid var(--gold);border-radius:5px;padding:1px 7px;margin-left:6px;}
  h1{font-size:21px;line-height:1.4;margin:4px 0 8px;}
  .meta{font-size:12.5px;color:var(--txt3);margin-bottom:6px;}
  .orig{font-size:12.5px;color:var(--txt3);background:#fafafa;border-left:3px solid var(--line);
    padding:7px 10px;border-radius:0 6px 6px 0;margin:10px 0 16px;word-break:break-word;}
  .sec-title{font-size:13px;font-weight:700;color:var(--red);margin:18px 0 6px;
    border-bottom:1px solid var(--line);padding-bottom:5px;}
  .body{font-size:15px;color:var(--txt);white-space:pre-wrap;}
  .toggle{margin:18px 0 0;}
  .toggle button{width:100%;font-size:14px;font-weight:700;color:var(--red);background:#fff;
    border:1.5px solid var(--red);border-radius:10px;padding:11px;cursor:pointer;}
  .toggle button:active{background:#fff0f4;}
  .full{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .full.open{display:block;}
  .links{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;}
  .links a{font-size:13px;font-weight:600;text-decoration:none;border-radius:18px;
    padding:8px 14px;border:1px solid var(--line);}
  .a-orig{color:var(--blue);background:var(--card);}
  .foot{font-size:11px;color:var(--txt3);text-align:center;margin-top:22px;}
  .err{padding:40px 16px;text-align:center;color:var(--txt3);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="javascript:history.length>1?history.back():location.href='briefing.html'">← 보고서로</a>
      <span class="brand">신신사 경영 브리핑 · 한국어 번역</span>
    </div>
    <div id="root"><div class="err">불러오는 중…</div></div>
    <div class="foot">원문 저작권은 각 매체에 있으며, 본 번역은 내부 참고용 자동 번역입니다.<br>AI 자동 번역 / 검수: 이승환 선임</div>
  </div>

<script>
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qp(k){return new URLSearchParams(location.search).get(k);}
// 한국어 본문을 문장 단위 단락으로 분리해 가독성 향상
function paras(text){
  if(!text) return '';
  let t = esc(text);
  // '[신신사 시사점]'은 항상 새 단락으로
  t = t.replace(/\s*(\[[^\]]*시사점[^\]]*\])/g, '\n\n$1');
  // 한국어 문장 종결(다/요/음/함/됨/까/네 + 마침표·물음표·느낌표 + 공백) 뒤 단락 구분
  //  숫자의 소수점(예: 182.81, 48.6%)은 앞 글자가 한글이 아니므로 영향 없음
  t = t.replace(/([다요음함됨까네])([.!?])\s+/g, '$1$2\n\n');
  return t.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean)
          .map(s=>`<p style="margin:0 0 11px;">${s}</p>`).join('');
}

async function load(){
  const id = qp('id');
  const root = document.getElementById('root');
  if(!id){ root.innerHTML='<div class="err">기사 ID가 없습니다.</div>'; return; }
  let data;
  try{
    const r = await fetch('translations.json?_='+Date.now());
    data = await r.json();
  }catch(e){
    root.innerHTML='<div class="err">번역 데이터를 불러오지 못했습니다.</div>'; return;
  }
  const it = (data.items||{})[id];
  if(!it){ root.innerHTML='<div class="err">해당 기사의 번역을 찾을 수 없습니다. (id: '+esc(id)+')</div>'; return; }

  root.innerHTML = `
    <div class="card">
      <span class="badge">🌐 한국어 번역</span>${it.category?`<span class="cat">${esc(it.category)}</span>`:''}
      <h1>${esc(it.title_ko||'')}</h1>
      <div class="meta">${esc(it.source||'')} · ${esc(it.pubDate||'')}</div>
      ${it.title_orig?`<div class="orig">원제: ${esc(it.title_orig)}</div>`:''}

      <div class="sec-title">핵심 요약</div>
      <div class="body">${paras(it.summary_ko)}</div>

      ${it.full_ko?`
      <div class="toggle"><button id="tg">📄 전문 번역 보기 ▾</button></div>
      <div class="full" id="full">
        <div class="sec-title">전문 번역</div>
        <div class="body">${paras(it.full_ko)}</div>
      </div>`:''}

      <div class="links">
        ${it.url?`<a class="a-orig" href="${esc(it.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>`:''}
      </div>
    </div>`;

  const tg = document.getElementById('tg');
  if(tg){
    tg.addEventListener('click', ()=>{
      const f = document.getElementById('full');
      const open = f.classList.toggle('open');
      tg.textContent = open ? '📄 전문 번역 접기 ▴' : '📄 전문 번역 보기 ▾';
    });
  }
  document.title = (it.title_ko||'한국어 번역') + ' — 신신사 브리핑';
}
load();
</script>
</body>
</html>
