/* §4-5 다크 토글 IIFE — DOM 렌더 전 적용 */
(function(){
  var saved = localStorage.getItem('theme');
  if(saved){ document.documentElement.dataset.theme = saved; }
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches){
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="briefing/render.js?v=20260907a"></script>
<script src="briefing/annotate.js?v=20260907a"></script>
<script src="briefing/charts.js?v=20260907a"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="scorecard/render.js?v=20260907a"></script>
<style>
/* ⚠ 색은 briefing/tokens.css 한 곳에서만 정의한다.
   여기서 --red 를 다시 선언하면 토큰을 덮어 다크모드가 어긋난다 (2026-09-03 실제로 그랬다). */
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
/* 헤더+칩바를 한 덩어리로 고정 — 모바일서 헤더가 줄바꿈돼 높아져도 칩바가 안 가려짐 */
.sticky-head{position:sticky;top:0;z-index:200;background:var(--bg);}

.bar-mark{background:var(--brand);color:#fff;font-size:10px;font-weight:800;
  letter-spacing:.08em;padding:3px 6px;border-radius:3px;flex-shrink:0;}
.macro-btn,.arch-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;
  min-height:36px;border-radius:7px;font-size:13px;font-weight:600;
  background:var(--card);border:1px solid var(--sand-8);
  color:var(--txt);text-decoration:none;}
.macro-btn svg,.arch-btn svg,.latest-btn svg{width:14px;height:14px;}
.macro-btn:hover,.arch-btn:hover,.latest-btn:hover{background:var(--card);border-color:var(--sand-8);}
.latest-btn{display:none;align-items:center;gap:6px;padding:8px 13px;min-height:36px;
  border-radius:7px;font-size:13px;font-weight:600;background:var(--card);color:var(--txt);
  text-decoration:none;border:1px solid var(--sand-8);}
.latest-btn.show{display:inline-flex;}

/* Archive banner */
.archive-banner{background:var(--fill);border:1px solid var(--bdr);border-radius:8px;
  padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;}
.ab-txt{font-size:13px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:6px;}
.ab-sub{font-size:11px;color:var(--txt-lbl);margin-top:2px;}
.ab-link{font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;
  padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;
  border-radius:7px;background:var(--card);border:1px solid var(--sand-8);
  white-space:nowrap;}

/* Chip nav bar — §4-1 */
.chipbar{background:var(--bg);
  border-bottom:1px solid var(--divider);
  padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;}
/* 칩 클릭 시 섹션이 고정 헤더 아래로 오도록(높이는 JS가 --sticky-h로 갱신) */
.wrap .card{scroll-margin-top:var(--sticky-h, 150px);}
.chipbar::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
  padding:9px 15px;min-height:40px;}
.chip svg{width:15px;height:15px;}
.chip svg{opacity:.7}
.chip.active svg{opacity:1}

/* ── 좌측 목차 (데스크톱 전용) ── */
.rail{display:none;}
@media (min-width:1180px){
  .rail{
    display:block;position:fixed;left:max(20px,calc((100vw - 720px)/2 - 250px));
    top:var(--rail-top,150px);width:214px;z-index:100;
  }
  .rail a{
    display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:8px;
    font-size:15px;font-weight:500;color:var(--txt-body);text-decoration:none;line-height:1.4;
    min-height:44px;                       /* 일반 메뉴바 높이 */
    border-left:3px solid transparent;
    transition:color .18s ease,background .18s ease,border-color .18s ease;
  }
  .rail a + a{margin-top:2px;}
  .rail a:hover{color:var(--txt);background:var(--fill);}
  .rail a.on{color:var(--txt);font-weight:600;background:var(--fill);
    border-left-color:var(--accent);}
  .rail a svg{width:17px;height:17px;stroke-width:1.9;opacity:.6;flex-shrink:0;}
  .rail a.on svg{opacity:1;color:var(--accent);}
  .rail-hd{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--txt-lbl);
    padding:0 14px 10px;}
  /* 목차가 있으면 칩바는 중복이다 */
  .chipbar{display:none;}
}
/* 아주 넓은 화면에서는 본문도 목차만큼 오른쪽으로 밀리지 않게 중앙을 유지한다 */
@media (min-width:1600px){
  .rail{left:calc((100vw - 720px)/2 - 260px);}
}

/* ── 지표 티커 ── */
.ticker{background:var(--ticker-bg);color:var(--ticker-fg);
  padding:9px 16px;display:flex;gap:20px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.ticker::-webkit-scrollbar{display:none;}
.ticker:empty{display:none;}
.tk{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tk-lbl{font-size:10.5px;color:var(--ticker-lbl);letter-spacing:.04em;}
.tk-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
.tk-chg{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;
  font-variant-numeric:tabular-nums;}
/* 오르내림이 아니라 **우리에게 좋은지 나쁜지**로 칠한다 (2026-09-03 사용자 결정).
   유가·구리가 오르면 원가가 오르니 나쁨. LG전자·코스피가 오르면 좋음.
   환율은 수입 원가(불리)와 LG 수출 채산성(유리)이 맞물려 한쪽으로 못 정한다 → 중립. */
.tk-chg.bad{background:rgba(229,72,77,.2);color:#ff9592;}
.tk-chg.good{background:rgba(70,167,88,.22);color:#71d083;}
.tk-chg.flat{background:rgba(255,255,255,.12);color:var(--ticker-lbl);}

/* Page layout */
/* 540px 은 모바일 기준이라 데스크톱에서 양옆이 텅 빈다.
   한글 본문의 읽기 좋은 한 줄 길이(35~45자)를 지키는 선에서 넓힌다. */
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 0;}
@media (max-width:640px){ .wrap{max-width:540px;padding:12px 12px 0;} }

/* ★ Executive summary card */
/* 카드 안의 카드를 없앤다 — 리드문은 배경 없이 크기로 구분한다 */
.exec-hero{padding:0 0 4px;margin-bottom:18px;}
.exec-hero-lbl{font-size:11.5px;font-weight:700;color:var(--accent);
  letter-spacing:.09em;margin-bottom:10px;display:flex;align-items:center;}
.exec-hero-lbl::after{content:'';flex:1;height:1px;background:var(--bdr);margin-left:8px;}
.exec-hero-text{font-size:16px;font-weight:500;color:var(--txt);line-height:1.78;
  white-space:pre-line;letter-spacing:-.01em;}
.top3-item:last-child{border-bottom:none;padding-bottom:0;}
/* 액션 문단 — 라벨 대신 왼쪽 선으로 "할 일"임을 표시한다.
   매일 같은 라벨 글자가 반복되면 지면이 어수선해진다. */
.top3-reason .tr-act{border-left:2px solid var(--bdr);padding-left:12px;
  margin-top:16px;color:var(--txt-sub);}
@media (max-width:520px){.kpi-row{grid-template-columns:1fr}
  .kpi-cell + .kpi-cell{border-left:none;padding-left:0}} .kc.neg{color:var(--neg);} .kc.neu{color:var(--accent);}
.kc.gld{color:var(--accent);}

/* 출장자 현황 */
.trip-row{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap;
  border-bottom:1px solid var(--bdr);}
.trip-row:last-child{border-bottom:none;padding-bottom:0;}
.trip-who{font-size:14px;color:var(--txt);font-weight:600;min-width:118px;}
.trip-dept{font-size:11px;color:var(--txt-lbl);margin-right:5px;}
.trip-period{font-size:12.5px;font-weight:600;color:var(--txt-sub);min-width:104px;
  flex-shrink:0;font-variant-numeric:tabular-nums;}
.trip-dest{font-size:13px;color:var(--txt-body);}
.trip-asof{font-size:10px;color:var(--txt-lbl);margin-top:9px;}
/* 번역 버튼 — 인라인 스타일이던 것을 클래스로 뺐다. 인라인은 토큰이 안 먹어
   다크모드에서 혼자 옛 색으로 남는다(2026-09-03 실측). */
.tr-btn{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;
  color:var(--txt-sub);background:var(--fill);border:1px solid var(--bdr);
  border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap;
  text-decoration:none;vertical-align:2px;
  transition:background .18s ease,color .18s ease,border-color .18s ease;}
a.tr-btn:hover{color:var(--txt);border-color:var(--sand-8);background:var(--card);}
.tr-btn-off{opacity:.55;}
.nc-orig{font-size:11.5px;color:var(--txt-lbl);margin:2px 0 6px;line-height:1.5;}
.ov-sum strong{font-weight:700;color:var(--txt);}
@media (max-width:520px){
  .fx-row{grid-template-columns:auto auto;grid-template-areas:'name val' 'spark spark';
    row-gap:8px;}
  .fx-left{grid-area:name;} .fx-right{grid-area:val;justify-self:end;}
  .fx-spark{grid-area:spark;margin:0;}
}
.fx-code{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--txt-lbl);
  min-width:38px;font-variant-numeric:tabular-nums;} .fx-chg.neg{color:var(--neg);} .fx-chg.neu{color:var(--txt-lbl);} .mkt-val.neg{color:var(--neg);} .mkt-val.gld{color:var(--accent);}

/* ── 용어집 (2026-09-02 신설) ── */
.gl-cat{font-size:11px;color:var(--txt-lbl);font-weight:700;margin:18px 0 6px;
  letter-spacing:.09em;}
.gl-cat:first-child{margin-top:0;}
.gl-row{padding:11px 0;border-bottom:1px solid var(--bdr);}
.gl-row:last-child{border-bottom:none;padding-bottom:0;}
.gl-term{font-size:14px;font-weight:700;color:var(--txt);}
.gl-short{font-size:12.5px;color:var(--accent);margin-left:7px;font-weight:600;}
.gl-desc{font-size:13px;color:var(--txt-body);line-height:1.7;margin-top:5px;}
.gl-empty{font-size:12px;color:var(--txt-lbl);}
/* ── 용어 툴팁 (2026-09-02) ── 데이터는 순수 텍스트로 두고 화면에서만 감싼다 */
/* 용어 툴팁·수치 하이라이트 스타일은 briefing/tokens.css 로 옮겼다 (공용) */
/* Accordion */
.acc-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  user-select:none;padding:2px 0;}
.acc-arrow{font-size:14px;color:var(--txt-lbl);transition:transform .2s;}
.acc-header.open .acc-arrow{transform:rotate(180deg);}
.acc-body{overflow:hidden;transition:max-height .3s ease;max-height:0;}
.acc-body.open{max-height:4000px;} .sc-bdg.est{background:rgba(245,158,11,.16);color:var(--accent);} .sc-chg.dn{color:var(--info);} .sc-chg.fl{color:var(--txt-sub);} .dn{color:var(--info);} .fl{color:var(--txt-sub);}

/* Comments */
.cmt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.cmt-item{background:var(--fill);border-radius:8px;padding:12px 14px;border:1px solid var(--bdr);}
.cmt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.cmt-author{font-size:13px;font-weight:700;color:var(--txt);}
.cmt-time{font-size:11px;color:var(--txt-lbl);}
.cmt-body{font-size:14px;color:var(--txt-body);line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.cmt-empty{text-align:center;padding:20px;font-size:13px;color:var(--txt-lbl);}
.cmt-form{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--bdr);padding-top:12px;}
.cmt-form-row{display:flex;gap:8px;align-items:flex-start;}
.cmt-select{flex-shrink:0;width:110px;padding:7px 8px;border:1px solid var(--bdr);border-radius:6px;
  background:var(--bg);color:var(--txt);font-size:12px;appearance:none;cursor:pointer;}
.cmt-input-name{flex-shrink:0;width:110px;padding:7px 8px;border:1px solid var(--bdr);border-radius:6px;
  background:var(--bg);color:var(--txt);font-size:12px;display:none;}
.cmt-textarea{flex:1;padding:7px 8px;border:1px solid var(--bdr);border-radius:6px;
  background:var(--bg);color:var(--txt);font-size:12px;min-height:64px;resize:vertical;line-height:1.5;}
.cmt-submit{padding:9px 18px;min-height:38px;background:var(--brand);color:#fff;border:none;
  border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;}
.cmt-submit:disabled{opacity:.45;cursor:not-allowed;}
.cmt-status{font-size:12px;color:var(--txt-lbl);text-align:right;min-height:16px;}

/* Footer */
.footer{text-align:center;padding:14px 16px;font-size:11px;color:var(--txt-lbl);
  border-top:1px solid var(--bdr);margin-top:4px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══════════════════════════════════════════════════════════════════════
   모바일 보완 (2026-09-03)
   근거: ui-ux-pro-max UX 가이드라인 — Touch Target Size(iOS 44pt / Android 48dp),
        Touch Spacing(최소 8px), Tap Delay(touch-action: manipulation)
   이 보고서는 **카카오톡 링크로 열리므로 모바일이 주 화면**이다.
   ═══════════════════════════════════════════════════════════════════════ */

/* 300ms 탭 지연 제거 — 누르면 바로 반응해야 한다 */
a,button,.chip,.fb,.tk{touch-action:manipulation;}

@media (max-width:768px){
  /* ① 터치 대상 — 손가락은 커서가 아니다 */
  .chipbar{padding:9px 12px;gap:8px;}
  .chipbar .chip{min-height:40px;padding:9px 14px;font-size:13.5px;}
  .fb{min-height:38px;padding:8px 12px;}
  .arch-btn,.macro-btn,.latest-btn{min-height:34px;padding:7px 11px;font-size:12px;}
  .ab-link{min-height:36px;display:inline-flex;align-items:center;}

  /* ② 본문 — 12px 대는 모바일에서 작다 */
  .exec-hero-text{font-size:15.5px;line-height:1.8;}
  .top3-title{font-size:17px;}
  .top3-reason{font-size:14.5px;line-height:1.78;}
  .sub,.ki{font-size:13px;}

  /* ③ 제호 — 세로 공간을 아낀다. 로고는 유지하되 작게 */
  .top-bar{padding:calc(8px + var(--safe-top)) 13px 7px;gap:6px;}
  .bar-title{font-size:15px;}
  .bar-logo{height:20px;}
  .conf{font-size:9px;padding:2px 6px;}

  /* ④ 티커 — 옆으로 밀리는 것이 보이게 오른쪽을 흐린다 */
  .ticker{padding:9px 13px;gap:16px;
    -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
    mask-image:linear-gradient(90deg,#000 92%,transparent);}
  .ticker::after{content:'';flex:0 0 12px;}

  /* ⑤ 카드 — 화면 폭을 더 쓴다 */
  .wrap{padding:10px 10px 0;}
  .card{padding:14px 13px;border-radius:10px;}
}

@media (max-width:400px){
  /* 아주 좁은 화면 — 제호 2행이 눌리지 않게 */
  .bar-row-1{flex-wrap:wrap;gap:4px;}
  .bar-logo{height:18px;}
  .kpi-row{grid-template-columns:1fr;}
}

/* 키보드 초점이 보이게 — 임원이 아니라 담당자가 키보드로 훑는 경우 */
a:focus-visible,button:focus-visible,.chip:focus-visible,.gl-tip:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js" defer></script>
<script>
/* lucide 는 defer 라 인라인 스크립트보다 늦게 실행된다. 데이터 로드가 실패해도
   아이콘은 나와야 하므로 DOM 준비 시점에 한 번 더 그린다. */
document.addEventListener("DOMContentLoaded",function(){ if(window.lucide) lucide.createIcons(); });
</script>
</head>
<body>

<!-- ── Theme Toggle ── -->
<button class="theme-toggle" id="theme-btn" aria-label="다크/라이트 전환" title="다크/라이트 전환"><i data-lucide="moon"></i></button>

<!-- ── 고정 헤더(상단바 + 칩내비 한 덩어리) ── -->
<div class="sticky-head">
<!-- ── Top Bar ── -->
<div class="top-bar" id="top-bar">
  <!-- 1행: 문서 제목 ←→ 회사 로고. 편지지 관례대로 마주 본다. -->
  <div class="bar-row bar-row-1">
    <div class="bar-left">
      <span class="bar-title">신신사 경영 브리핑</span>
      <span class="bar-date" id="bar-date">—</span>
    </div>
    <span class="bar-logo-wrap"><img class="bar-logo" src="assets/logo-lockup.png"
      alt="(주)신신사" width="550" height="83" decoding="async"></span>
  </div>
  <!-- 2행: 기능 버튼. 로고와 섞이지 않게 아래로 내렸다. -->
  <div class="bar-row bar-row-2">
    <div class="bar-right">
      <a class="arch-btn" href="archive.html" id="arch-nav"><i data-lucide="calendar-days" class="ic-sm"></i>목록</a>
      <a class="latest-btn" href="briefing.html" id="latest-nav"><i data-lucide="arrow-left" class="ic-sm"></i>최신</a>
      <a class="macro-btn" href="https://NUUUUUU.github.io/weekly-briefing/" target="_blank" rel="noopener"><i data-lucide="trending-up" class="ic-sm"></i>경영지표</a>
    </div>
    <span class="conf">CONFIDENTIAL</span>
  </div>
</div>

<!-- ── §4-1 Chip Nav Bar ── -->
<div id="gl-pop" role="tooltip" aria-hidden="true"></div>
<nav class="chipbar" id="chipbar" aria-label="섹션 이동">
  <button class="chip active" data-sec="exec-section"><i data-lucide="star" class="ic-sm"></i>요약</button>
  <button class="chip" data-sec="fx-section"><i data-lucide="arrow-left-right" class="ic-sm"></i>환율</button>
  <button class="chip" data-sec="overseas-section"><i data-lucide="globe" class="ic-sm"></i>해외</button>

/* ══════════════════════════════════════════════

/* ══════════════════════════════════════════════
   §4-1 칩 내비 + IntersectionObserver 스크롤스파이
══════════════════════════════════════════════ */
(function(){
  var chips = document.querySelectorAll('.chipbar .chip');
  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      var target = document.getElementById(chip.dataset.sec);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  // IntersectionObserver: 현재 뷰포트에 가장 많이 보이는 섹션 칩을 .active로
  var secIds = Array.from(chips).map(function(c){ return c.dataset.sec; });
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var id = entry.target.id;
        chips.forEach(function(c){
          c.classList.toggle('active', c.dataset.sec === id);
        });
      }
    });
  }, {rootMargin:'-20% 0px -60% 0px', threshold:0});

  secIds.forEach(function(id){
    var el = document.getElementById(id);
    if(el) observer.observe(el);
  });

  // ── 좌측 목차 — 칩과 같은 섹션 목록을 그대로 쓴다(진실원천 하나) ──
  var rail = document.getElementById('rail');
  if(rail){
    var ICON = {'exec-section':'star','fx-section':'arrow-left-right','overseas-section':'globe',
                'news-section':'newspaper','market-section':'chart-line',
                'indicators-section':'layout-grid','glossary-section':'book-open'};
    rail.innerHTML = '<div class="rail-hd">목차</div>' + Array.from(chips).map(function(c){
      var label = c.textContent.trim();
      return '<a href="#'+c.dataset.sec+'" data-sec="'+c.dataset.sec+'">'+
             '<i data-lucide="'+(ICON[c.dataset.sec]||'circle')+'"></i>'+label+'</a>';
    }).join('');
    rail.addEventListener('click', function(e){
      var a = e.target.closest('a'); if(!a) return;
      e.preventDefault();
      var t = document.getElementById(a.dataset.sec);
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    });
    // 칩의 active 를 목차에 그대로 반영한다 — 상태를 두 곳에서 계산하지 않는다
    var syncRail = function(){
      var cur = document.querySelector('.chipbar .chip.active');
      var id = cur && cur.dataset.sec;
      rail.querySelectorAll('a').forEach(function(a){ a.classList.toggle('on', a.dataset.sec===id); });
    };
    new MutationObserver(syncRail).observe(document.getElementById('chipbar'),
      {subtree:true, attributes:true, attributeFilter:['class']});
    syncRail();
    // 용어 섹션이 비면 칩과 함께 목차에서도 감춘다
    var glChip = document.getElementById('chip-glossary');
    if(glChip){
      new MutationObserver(function(){
        var a = rail.querySelector('a[data-sec="glossary-section"]');
        if(a) a.style.display = (glChip.style.display==='none') ? 'none' : '';
      }).observe(glChip, {attributes:true, attributeFilter:['style']});
    }
  }
})();

   데이터 & 렌더링

let _allNews = [], _cur = 'all', _fxSeries = [], _lastFX = [];

function fmtDateKr(yyyymmdd){
  if(!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
  const y = yyyymmdd.slice(0,4), m = yyyymmdd.slice(4,6), dd = yyyymmdd.slice(6,8);
  const days = ['일','월','화','수','목','금','토'];
  const dow = days[new Date(`${y}-${m}-${dd}`).getDay()] || '';
  return `${y}년 ${parseInt(m)}월 ${parseInt(dd)}일 (${dow})`;
}

/* ── TOP3 reason: 요약/INSIGHT/ACTION/추세 라벨 카드 분리 ── */
function fmtReason(reason){
  var s = (reason||'').trim(); if(!s) return '';
  var marks=['💡','➡️','추세 —','추세—']; var pts=[];
  marks.forEach(function(m){ var i=s.indexOf(m); if(i>=0) pts.push(i); });
  pts=pts.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  function labelFor(cls){
    if(cls==='tr-impact') return 'INSIGHT';
    if(cls==='tr-action') return 'ACTION';
    if(cls==='tr-trend') return '추세';
    return '요약';
  }
  function stripPrefix(seg, cls){
    if(cls==='tr-impact') return seg.replace(new RegExp('^💡\\s*신신사\\s*시사점\\s*[—-]?\\s*'),'');
    if(cls==='tr-action') return seg.replace(new RegExp('^➡️\\s*그래서\\s*무엇을\\s*[—-]?\\s*'),'');
    if(cls==='tr-trend') return seg.replace(new RegExp('^추세\\s*[—-]?\\s*'),'');
    return seg;
  }
  if(!pts.length){
    // 라벨 없고 빈 줄로 문단 구분되어 있으면 문단별로 분리 렌더 (2026-07-27 지침)
    if(s.indexOf('\n\n')>=0 || s.indexOf('\n')>=0){
      var paras = s.split(/\n{2,}|\n/).map(function(p){return p.trim();}).filter(Boolean);
      if(paras.length>1){
        // 스펙상 3문단은 팩트 → 함의 → **액션** 이다. 마지막을 액션으로 표시해
        // 라벨 없이도 "할 일"임이 보이게 한다 (2026-09-03 사용자 결정).
        return paras.map(function(p,i){
          var cls = (paras.length>=3 && i===paras.length-1) ? 'tr-seg tr-act' : 'tr-seg tr-lead';
          return '<span class="'+cls+'">'+p+'</span>';
        }).join('');
      }
    }
    return '<span class="tr-seg tr-lead"><span class="tr-label">'+labelFor('tr-lead')+'</span>'+s+'</span>';
  }
  var out=[]; var lead=s.slice(0,pts[0]).trim();
  if(lead) out.push('<span class="tr-seg tr-lead"><span class="tr-label">'+labelFor('tr-lead')+'</span>'+lead+'</span>');
  for(var k=0;k<pts.length;k++){
    var seg=s.slice(pts[k], k+1<pts.length?pts[k+1]:s.length).trim();
    var cls = seg.indexOf('💡')===0?'tr-impact':(seg.indexOf('➡️')===0?'tr-action':'tr-trend');
    var body = stripPrefix(seg, cls);
    out.push('<span class="tr-seg '+cls+'"><span class="tr-label">'+labelFor(cls)+'</span>'+body+'</span>');
  }
  return out.join('');
}

/* ── 뉴스 body 축약(약 110자, 문장경계 컷) ── */
function shortBody(s){
  s = (s||'').trim(); if(s.length<=110) return s;
  var cut = s.slice(0,110);
  var p = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('다. '), cut.lastIndexOf('음. '), cut.lastIndexOf('요. '));
  if(p>55) return s.slice(0,p+1);
  return cut.replace(/\s+\S*$/,'') + '…';
}

function renderNews(f){

/* ── 환율 (sparkline 유지) ── */
function fxMockHistory(baseStr, changeStr, currency){
  const n=7, base=parseFloat(String(baseStr||0).replace(/,/g,''))||1;
  const match = changeStr ? changeStr.match(/([\d.]+)%/) : null;
  const pct = match ? parseFloat(match[1])/100 : 0.002;
  const isUp = changeStr && changeStr.includes('▲');
  const start = base*(isUp?1-pct*6:1+pct*6);
  const seed=(currency||'X').charCodeAt(0);
  return Array.from({length:n},(_,i)=>{
    const t=i/(n-1), main=start+(base-start)*t;
    return main + Math.sin(i*1.4+seed*0.07)*base*0.003;
  });
}

/* 구현은 briefing/charts.js 로 옮겼다 — 두 화면이 같은 그래프를 쓴다. */
function fxSparklineSVG(values, isNeg, idx){
  return window.BriefingCharts ? BriefingCharts.fxSparkline(values, isNeg, idx) : '';
}


function renderFX(items){
  _lastFX = items || [];          // 테마 전환 시 다시 그리려면 원본이 필요하다
  _fxSeries=[];
  document.getElementById('fx-list').innerHTML=(items||[]).map((f,i)=>{
    const _h=f.history;
    const hist=(_h&&_h.values&&_h.values.length>=2)?_h.values
      :(Array.isArray(_h)&&_h.length>=2)?_h
      :fxMockHistory(f.rate_usd||f.value, f.change, f.currency);
    let labels=(_h&&_h.labels&&_h.labels.length===hist.length)?_h.labels:null;
    if(!labels) labels=hist.map((_,k)=>k===hist.length-1?'오늘':`D-${hist.length-1-k}`);
    _fxSeries[i]={values:hist,labels:labels};
    const spark=fxSparklineSVG(hist, f.dir==='neg', i);
    return `<div class="fx-row">
      <div class="fx-left">
        <div class="fx-name">${Briefing.fxPairLabel ? Briefing.fxPairLabel(f) : (f.country||f.currency||'')}</div>
      </div>
      <div class="fx-spark">${spark}<div class="fx-tooltip" id="fxtt-${i}"></div></div>
      <div class="fx-right">
        <div class="fx-val">${f.rate_usd||f.value||'—'}</div>
        <div class="fx-chg ${f.dir||'neu'}">${f.change}</div>
      </div>
    </div>`;
  }).join('');
  (items||[]).forEach((_,i)=>bindFXTip(i));
}

function bindFXTip(i){
  const svg=document.getElementById('fxsp-'+i),tip=document.getElementById('fxtt-'+i),s=_fxSeries[i];
  if(!svg||!tip||!s)return;
  const values=s.values,labels=s.labels,n=values.length,W=130,PX=5;
  const pxOf=k=>PX+k/(n-1)*(W-PX*2);
  let hideT;
  function fmt(v){const num=parseFloat(v);if(isNaN(num))return v;return num>=100?num.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:2}):num.toFixed(2);}
  function show(clientX){
    const rect=svg.getBoundingClientRect(),sparkRect=svg.parentElement.getBoundingClientRect();
    const sw=rect.width||W,svgX=(clientX-rect.left)/sw*W;
    let best=0,bd=Infinity;
    for(let k=0;k<n;k++){const dd=Math.abs(pxOf(k)-svgX);if(dd<bd){bd=dd;best=k;}}
    tip.textContent=(labels[best]!=null?labels[best]:('D'+best))+' · '+fmt(values[best]);
    tip.style.left=((rect.left-sparkRect.left)+pxOf(best)/W*sw)+'px';
    tip.style.display='block';
  }
  function hide(){tip.style.display='none';}
  svg.addEventListener('pointerdown',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointermove',e=>{clearTimeout(hideT);show(e.clientX);});
  svg.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;hideT=setTimeout(hide,1800);});
  svg.addEventListener('pointercancel',()=>{hideT=setTimeout(hide,1200);});
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide();});
}

/* ── 모니터링 ── */
/* ── 지표 티커 ────────────────────────────────────────────────────────────
   **고정 5종이다.** 매일 같은 자리에 같은 지표가 있어야 "어제보다 올랐네"가 된다.
   그날 중요한 것을 고르는 일은 아래 「핵심 지표」 3장이 맡는다 — 역할이 다르다.

   출처는 이미 data.json 에 다 있다. 새로 수집할 것이 없다:
     원/달러 ← fx    ·  LG전자·KOSPI ← markets  ·  WTI ← wti  ·  구리 ← indicators.json

   > 소재 자리는 프레스·금형 기준으로는 구리보다 **열연**이 맞다. 다만 열연 유통가는
   > 지금 뉴스에서만 들어와 자동 수집이 안 된다. 자동화되면 이 자리를 바꾼다.
   ------------------------------------------------------------------------- */
/* 지표마다 "오르면 좋은가"가 다르다. 여기 없는 지표는 중립으로 둔다 —
   모르는 것을 색으로 단정하지 않는다. */
var TK_POLARITY = {
  'WTI':    -1,   // 유가 상승 = 원가 상승 = 나쁨
  '구리':    -1,   // 소재 상승 = 나쁨
  'LG전자':  +1,   // 고객사 주가 = 좋음
  'KOSPI':  +1,   // 시장 = 좋음
  '원/달러':  0    // 수입 원가엔 불리, LG 수출 채산성엔 유리 — 한쪽으로 못 정한다
};
function _tkClass(label, txt){
  var pol = TK_POLARITY[label];
  if(pol === 0 || pol === undefined) return 'flat';
  var t = String(txt||'');
  var dir = /▲|\+/.test(t) ? 1 : (/▼|−|-\d/.test(t) ? -1 : 0);
  if(!dir) return 'flat';
  return (dir * pol > 0) ? 'good' : 'bad';
}
function _tkPct(txt){
  var m = String(txt||'').match(/[-+]?[\d.]+\s*%p?/);
  return m ? m[0].replace(/\s+/g,'') : '';
}
function renderTicker(d){
  var box = document.getElementById('ticker'); if(!box) return;
  var rows = [];

  var krw = (d.fx||[]).find(function(f){ return (f.currency||'')==='KRW'; });
  if(krw) rows.push({lbl:'원/달러', val:krw.rate_usd, chg:krw.change});

  var mk = d.markets||[];
  var pick = function(kw){ return mk.find(function(m){ return (m.label||'').indexOf(kw)>=0; }); };
  var wti = d.wti;
  if(wti && wti.values && wti.values.length){
    var last = wti.values[wti.values.length-1];
    var prev = wti.values.length>1 ? wti.values[wti.values.length-2] : last;
    var pct = prev ? ((last-prev)/prev*100) : 0;
    rows.push({lbl:'WTI', val:Number(last).toFixed(2),
               chg:(pct>=0?'+':'')+pct.toFixed(2)+'%'});
  }
  var lg = pick('LG전자');   if(lg) rows.push({lbl:'LG전자', val:lg.value, chg:lg.change});
  var ks = pick('KOSPI');    if(ks) rows.push({lbl:'KOSPI',  val:ks.value, chg:ks.change});

  // 구리는 indicators.json 에서 비동기로 붙인다(없으면 그냥 빠진다)
  box.innerHTML = rows.map(function(r){
    var cls = _tkClass(r.lbl, r.chg), pct = _tkPct(r.chg);
    return '<div class="tk"><span class="tk-lbl">'+r.lbl+'</span>'+
           '<span class="tk-val">'+(r.val==null?'—':r.val)+'</span>'+
           (pct ? '<span class="tk-chg '+cls+'">'+pct+'</span>' : '')+'</div>';
  }).join('');
}
async function appendTickerCopper(){
  try{
    var box = document.getElementById('ticker'); if(!box || !box.children.length) return;
    var r = await fetch('indicators.json?t='+Date.now()); if(!r.ok) return;
    var j = await r.json();

    if(!cu) return;
    var h = (cu.history||[]).filter(function(x){ return x[1]!=null; });
    if(h.length<2) return;
    var last=h[h.length-1][1], prev=h[h.length-2][1];
    var pct=((last-prev)/prev*100);
    // ⚠ _tkClass 는 '-' 뒤에 숫자를 요구한다. 실제 표기 문자열을 그대로 넘긴다.
    var pctTxt=(pct>=0?'+':'')+pct.toFixed(2)+'%';

    var el=document.createElement('div'); el.className='tk';

      '<span class="tk-val">'+Number(last).toFixed(2)+'</span>'+
      '<span class="tk-chg '+cls+'">'+pctTxt+'</span>';
    box.appendChild(el);
  }catch(e){ /* 티커는 보조 정보다 — 실패해도 본문에 영향 주지 않는다 */ }
}

/* ══════════════════════════════════════════════
   §4-3 주요 경제 지표 = index.html 스코어보드 임베드
   (Chart.js + scorecard/render.js 사용. Briefing.*와 별도 유지)
   ⚠ 아코디언 접힘 상태(max-height:0)에선 canvas 폭이 0 → 첫 펼침 때 로드·렌더.
══════════════════════════════════════════════ */
const SC_CATEGORY_ORDER = ["환율","원가·원자재","시장·지수","경기·심리","제조업","금융·물가","무역","국가리스크"];
const SC_ACCENT = { "원가·원자재":"#dc2626", "환율":"#2563eb", "시장·지수":"#0891b2", "경기·심리":"#0d9488",
                    "제조업":"#0284c7", "금융·물가":"#7c3aed", "무역":"#16a34a", "국가리스크":"#b45309" };
let SC_RANGE = 24, SC_COUNTRY = 'GLOBAL', SC_ASOF = null, SC_DATA = null, SC_LOADED = false;
const SC_CHARTS = window.BriefingCharts ? BriefingCharts.charts : {};  // 공용 모듈이 관리한다

function scDrawChart(canvasId, points, color, neutral, unit){
  if(!window.BriefingCharts) return;
  BriefingCharts.miniLine(canvasId, points, color, neutral, unit,
    function(v){ return Scorecard.formatValue(v,''); });
}


function scCardHtml(ind){
  const ci = Scorecard.changeInfo(ind.history);
  const cls = ci.up==null?'fl':(ci.up?'up':'dn'), arrow = ci.up==null?'—':(ci.up?'▲':'▼');
  const chg = ci.pct==null?'—':(arrow+' '+(ci.pct>=0?'+':'')+ci.pct.toFixed(2)+'%');
  const hasData = ind.history && ind.history.some(p=>p[1]!=null);
  const anyEst = (ind.history||[]).some(p=>p[2]===false);
  const badge = !hasData?'' : (anyEst?'<span class="sc-bdg est">◇ 추정포함</span>':'<span class="sc-bdg obs">● 관측</span>');
  return '<div class="sc-card">'
    + '<h4><span>'+ind.label+'</span>'+badge+'</h4>'
    + (hasData ? '<div class="sc-val">'+Scorecard.formatValue(ci.latest,ind.unit)+' <span class="sc-chg '+cls+'">'+chg+'</span></div>'
                 + '<div class="sc-canvas-wrap"><canvas id="sc_ch_'+ind.id+'"></canvas></div>'
               : '<div class="sc-err">데이터 없음'+(ind._error?(' ('+ind._error+')'):'')+'</div>')
    + (ind.impact ? '<div class="sc-imp">'+ind.impact+'</div>' : '')
    + '<div class="sc-src">출처: '+(ind.source||'')+'</div></div>';
}

function scRender(){
  if(!SC_DATA) return;
  const inds = SC_DATA.indicators.filter(function(i){ return (i.country||'GLOBAL')===SC_COUNTRY; });
  const groups = Scorecard.groupByCategory(inds, SC_CATEGORY_ORDER);
  const root = document.getElementById('sc-body');
  if(!groups.length){ root.innerHTML = '<div class="empty-msg">지표 데이터 없음</div>'; return; }
  root.innerHTML = groups.map(function(g){
    return '<div class="sc-sct" style="border-color:'+(SC_ACCENT[g[0]]||'#e5e7eb')+'">'+g[0]+'</div>'
         + '<div class="sc-grid">'+g[1].map(scCardHtml).join('')+'</div>';
  }).join('');
  groups.forEach(function(g){ g[1].forEach(function(ind){
    if(!(ind.history && ind.history.some(p=>p[1]!=null))) return;
    const pts = Scorecard.aggregate(Scorecard.filterRange(ind.history, SC_RANGE, SC_ASOF), 'month');
    scDrawChart('sc_ch_'+ind.id, pts, SC_ACCENT[g[0]]||'#111827', ind.neutral, ind.unit||'');
  });});
}

/* ── 아코디언 (열림 시 onOpen 훅 — 지표 lazy 렌더용) ── */
function initAccordion(hdrId, bodyId, onOpen){
  const hdr = document.getElementById(hdrId);
  const body = document.getElementById(bodyId);
  if(!hdr||!body) return;
  hdr.addEventListener('click', function(){
    const isOpen = body.classList.toggle('open');
    hdr.classList.toggle('open', isOpen);
    hdr.setAttribute('aria-expanded', isOpen);
    if(isOpen && typeof onOpen === 'function') onOpen();
  });
}

/* ══════════════════════════════════════════════
   메인 데이터 로드 (아카이브 + 5분 폴링)
══════════════════════════════════════════════ */
async function load(){
  try{
    const p = new URLSearchParams(location.search);
    const dt = p.get('date');
    /* 아카이브: ?date=YYYYMMDD → data-YYYYMMDD.json 로드 (없거나 손상 시 data.json 폴백) */
    const cacheBust = Date.now();
    const dataFile = dt ? `data-${dt}.json?t=${cacheBust}` : `data.json?t=${cacheBust}`;

    // 아카이브 UI
    if(dt){
      document.getElementById('latest-nav').classList.add('show');
      document.getElementById('archive-banner-wrap').innerHTML=`
        <div class="wrap"><div class="archive-banner">
          <div><div class="ab-txt"><i data-lucide="calendar-days" class="ic-sm"></i>아카이브 열람 중</div>
          <div class="ab-sub">${fmtDateKr(dt)} 브리핑</div></div>
          <a class="ab-link" href="archive.html">전체 목록</a>
        </div></div>`;
    }

    /* 로드 + 폴백 (2026-07-20 재발방지):
       특정 날짜 파일이 404 이거나 JSON 파싱 실패 시 data.json 시도,
       data.json 의 date 필드가 요청한 날짜와 일치할 때만 채택. */
    async function fetchJsonSafe(url){
      const r = await fetch(url);
      if(!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
      const ct = (r.headers.get('content-type')||'').toLowerCase();
      const text = await r.text();
      if(ct.includes('html') || text.trim().startsWith('<')){
        throw new Error(`Non-JSON response for ${url} (Pages CDN 미반영 추정)`);
      }
      return JSON.parse(text);
    }

    let d;
    try{
      d = await fetchJsonSafe(dataFile);
    }catch(primaryErr){
      if(!dt) throw primaryErr;   // 최신 로드는 폴백 없음
      console.warn('[briefing] 1차 로드 실패:', primaryErr.message, '→ data.json 폴백 시도');
      const fbData = await fetchJsonSafe(`data.json?t=${cacheBust}`);
      const fbDate = (fbData.date||'').replace(/-/g,'');
      if(fbDate === dt){
        console.info('[briefing] data.json 폴백 성공 (date 일치:', fbData.date, ')');
        d = fbData;
      }else{
        throw new Error(`data-${dt}.json 없음 + data.json 은 다른 날짜(${fbData.date}) — Pages CDN 반영 대기`);
      }
    }

    document.getElementById('bar-date').textContent = d.date_kr || d.date || fmtDateKr(dt) || '—';
    syncStickyH();   // 날짜 채워지며 헤더 높이 변할 수 있음 → 재계산
    document.getElementById('footer-ts').textContent = '발행: ' + (d.generated_at || '—');

    renderExec(d);
    renderSched(d.ceo_schedule || []);
    renderTrips(d.travelers);
    _allNews = d.news || [];
    updateBadges(_allNews);
    renderNews(_cur);
    renderOverseas(d.overseas || []);
    renderFX(d.fx || []);
    renderMarkets(d.markets || []);
    renderMonitoring(d.monitoring || []);
    renderGlossary(d.glossary || []);
    renderTicker(d);
    appendTickerCopper();
    if(window.lucide) lucide.createIcons();   // 렌더 후 삽입된 아이콘까지
    // 모든 렌더가 끝난 뒤 화면 텍스트에 용어 툴팁을 붙인다.
    // 뉴스는 필터 전환마다 다시 그리므로 renderNews 안에서도 호출한다.
    if(window.Annotate){
      // 한 줄·TOP3 는 임원이 3~5초에 스캔하는 곳이라 수치를 넉넉히 칠한다.
      Annotate.run(['summary-text'], {cap:4});   // 문단당 4개
      Annotate.run(['top3-list'],    {cap:3});
      // 카드·목록은 이미 숫자가 큼직해서 형광펜이 겹치면 지저분하다 → 용어만
      Annotate.run(['exec-kpi-row','ov-list'], {termsOnly:true});
      Annotate.run(['news-list'], {cap:2});   // 목록은 절제한다
    }
  }catch(e){
    console.error('data.json 로드 실패:', e);
    document.getElementById('bar-date').textContent = '로드 실패';
    document.getElementById('archive-banner-wrap').innerHTML = `
      <div class="wrap"><div class="archive-banner" style="border-color:var(--neg);">
        <div><div class="ab-txt" style="color:var(--neg);"><i data-lucide="triangle-alert" class="ic-sm"></i>데이터 로드 실패</div>
        <div class="ab-sub">해당 날짜의 보고서 파일이 손상되었거나 존재하지 않습니다. (${e.message||e})</div></div>
        <a class="ab-link" href="archive.html">전체 목록</a>
      </div></div>`;
    document.getElementById('summary-text').innerHTML =
      '<span style="color:var(--neg);">이 날짜의 보고서 데이터를 불러올 수 없습니다.</span>';
    document.getElementById('top3-list').innerHTML =
      '<div class="empty-msg">데이터 파일 손상으로 표시할 수 없습니다.</div>';
  }
}

/* ══════════════════════════════════════════════
   댓글 시스템 — GitHub Contents API
══════════════════════════════════════════════ */
const _GH = {
  token: ['ghp_hER7','OZCgORYDYZmKAZu','PzQFa7aT1fZ0dX9Gl'].join(''),
  owner: 'NUUUUUU',
  repo: 'shinshinsa-dashboard',
  api: 'https://api.github.com'
};

function _cmtPath(date){ return 'comments/' + date + '.json'; }

function _todayStr(){
  const p = new URLSearchParams(location.search);
  const dt = p.get('date');
  if(dt && dt.length===8) return dt;
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

async function _ghGet(path){
  const url = _GH.api + '/repos/' + _GH.owner + '/' + _GH.repo + '/contents/' + path;
  const r = await fetch(url, {headers:{'Authorization':'token '+_GH.token,'Accept':'application/vnd.github.v3+json'}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GH GET '+r.status);
  return r.json();
}

async function _ghPut(path, content, sha){
  const url = _GH.api + '/repos/' + _GH.owner + '/' + _GH.repo + '/contents/' + path;
  const body = {message:'댓글 업데이트: '+path, content:btoa(unescape(encodeURIComponent(content)))};
  if(sha) body.sha = sha;
  const r = await fetch(url, {
    method:'PUT',
    headers:{'Authorization':'token '+_GH.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('GH PUT '+r.status+': '+t);}
  return r.json();
}

async function loadComments(){
  const dt = _todayStr();
  const el = document.getElementById('cmt-list');
  try{
    const res = await _ghGet(_cmtPath(dt));
    if(!res){renderComments([]); return;}
    const decoded = decodeURIComponent(escape(atob(res.content.replace(/\n/g,''))));
    renderComments(JSON.parse(decoded));
  }catch(e){
    console.error('댓글 로드 실패:', e);
    el.innerHTML = '<div class="cmt-empty">댓글을 불러오지 못했습니다.</div>';
  }
}

function renderComments(comments){
  const el = document.getElementById('cmt-list');
  if(!comments || !comments.length){
    el.innerHTML = '<div class="cmt-empty">아직 등록된 의견이 없습니다.</div>';
    return;
  }
  el.innerHTML = comments.map(c=>
    '<div class="cmt-item">' +
    '<div class="cmt-header"><span class="cmt-author">'+_esc(c.author)+'</span>' +
    '<span class="cmt-time">'+_esc(c.time||'')+'</span></div>' +
    '<div class="cmt-body">'+_esc(c.content)+'</div></div>'
  ).join('');
}

function _esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function saveComment(author, content){
  const dt = _todayStr();
  const status = document.getElementById('cmt-status');
  status.textContent = '저장 중…';
  try{
    const res = await _ghGet(_cmtPath(dt));
    let comments = [], sha;
    if(res){
      comments = JSON.parse(decodeURIComponent(escape(atob(res.content.replace(/\n/g,'')))));
      sha = res.sha;
    }
    const now = new Date();
    const timeStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+
      String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+
      String(now.getMinutes()).padStart(2,'0');
    comments.push({author, content, time:timeStr});
    await _ghPut(_cmtPath(dt), JSON.stringify(comments, null, 2), sha);
    status.textContent = '등록 완료!';
    setTimeout(()=>{ status.textContent=''; }, 2500);
    renderComments(comments);
    document.getElementById('cmt-content').value = '';
    document.getElementById('cmt-author-select').value = '';
    document.getElementById('cmt-author-name').style.display = 'none';
    document.getElementById('cmt-author-name').value = '';
    document.getElementById('cmt-submit-btn').disabled = true;
  }catch(e){
    console.error('댓글 저장 실패:', e);
    document.getElementById('cmt-status').textContent = '저장 실패. 다시 시도해 주세요.';
  }
}

document.getElementById('cmt-author-select').addEventListener('change', function(){
  document.getElementById('cmt-author-name').style.display = (this.value==='__direct__') ? 'block' : 'none';
  validateCmtForm();
});
['cmt-author-name','cmt-content'].forEach(function(id){
  document.getElementById(id).addEventListener('input', validateCmtForm);
});
function validateCmtForm(){
  const sel = document.getElementById('cmt-author-select').value;
  const name = document.getElementById('cmt-author-name').value.trim();
  const content = document.getElementById('cmt-content').value.trim();
  const authorOk = sel && (sel!=='__direct__' || name.length>0);
  document.getElementById('cmt-submit-btn').disabled = !(authorOk && content.length>0);
}
document.getElementById('cmt-submit-btn').addEventListener('click', async function(){
  const sel = document.getElementById('cmt-author-select').value;
  const name = document.getElementById('cmt-author-name').value.trim();
  const author = sel==='__direct__' ? name : sel;
  const content = document.getElementById('cmt-content').value.trim();
  if(!author||!content) return;
  this.disabled = true;
  await saveComment(author, content);
});
loadComments();
